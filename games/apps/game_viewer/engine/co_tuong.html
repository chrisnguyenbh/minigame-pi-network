<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cờ Tướng</title>

  <link rel="stylesheet" href="libs/css/bootstrap.min.css">
  <script src="libs/js/jquery.min.js"></script>
  <script src="libs/js/bootstrap.bundle.min.js"></script>

  <style>
    :root {
      --panel: rgba(25, 20, 16, .92);
      --panel2: rgba(48, 38, 30, .94);
      --text: #f6ead8;
      --muted: #cdbda8;
      --accent: #d99a42;
      --accent2: #8f5d2e;
      --shadow: 0 18px 55px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(142, 83, 35, .32), transparent 38%),
        linear-gradient(135deg, #17110d 0%, #2a1b12 48%, #120e0b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .game-shell {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 300px;
      gap: 22px;
      align-items: start;
    }

    .board-card, .side-card {
      background: var(--panel);
      border: 1px solid rgba(217,154,66,.28);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .board-card { padding: 18px; }

    .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 14px;
    }

    .title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: .5px;
    }

    .brand {
      color: var(--accent);
      font-weight: 700;
    }

    #turnIndicator {
      font-size: 13px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: var(--muted);
    }

    #turnIndicator.ai-turn {
      color: #ffe2a8;
      background: rgba(217,154,66,.16);
    }

    #xiangqiboard {
      width: 100%;
      max-width: 506px;
      margin: auto;
      aspect-ratio: 9 / 10;
      border: 8px solid #6e401f;
      border-radius: 10px;
      overflow: hidden;
      background-image: url(game/images/boards/board-ccbridge.png);
      background-size: 100% 100%;
      background-position: center;
      box-shadow:
        inset 0 0 0 2px rgba(255,225,170,.35),
        0 15px 35px rgba(0,0,0,.38);
    }

    #xiangqiboard table {
      width: 100%;
      height: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    #xiangqiboard td {
      padding: 0;
      position: relative;
      cursor: pointer;
      transition: filter .12s ease, transform .08s ease;
    }

    #xiangqiboard td:hover { filter: brightness(1.08); }

    #xiangqiboard img {
      width: min(46px, 9vw) !important;
      max-width: 90%;
      user-select: none;
      -webkit-user-drag: element;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,.25));
    }

    .side-card { padding: 18px; }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin: 0 0 9px;
    }

    .mode-buttons {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-buttons button {
      border: 1px solid rgba(217,154,66,.35);
      background: rgba(255,255,255,.055);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .mode-buttons button:hover,
    .mode-buttons button.active {
      background: rgba(217,154,66,.18);
      border-color: var(--accent);
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 16px;
    }

    .toolbar button, .action {
      border: 0;
      border-radius: 9px;
      padding: 9px 7px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
    }

    .toolbar button:hover, .action:hover { background: #65462d; }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px;
      background: linear-gradient(135deg, #e1a04c, #a8662e);
      color: #21140b;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .options {
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 14px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin: 9px 0;
    }

    #pgn { display: none; }

    .hint {
      margin-top: 15px;
      color: #9e8e7b;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      body { padding: 10px; align-items: flex-start; }
      .game-shell { grid-template-columns: 1fr; max-width: 540px; }
      .side-card { order: 2; }
      .board-card { order: 1; padding: 10px; }
      .title h1 { font-size: 18px; }
      #xiangqiboard { border-width: 5px; }
    }
  </style>
</head>

<body>
  <main class="game-shell">
    <section class="board-card">
      <div class="title">
        <h1>♜ <span class="brand">Cờ Tướng</span></h1>
        <span id="turnIndicator">♟ Đỏ đi</span>
      </div>

      <div id="xiangqiboard"></div>

      <textarea id="pgn" rows="3" name="text" spellcheck="false"></textarea>
    </section>

    <aside class="side-card">
      <div class="section-title">Chế độ chơi</div>
      <div class="mode-buttons">
        <button id="mode-human-ai" onclick="setGameMode('human-vs-ai')">👤 Người (Đỏ) vs 🤖 AI (Đen)</button>
        <button id="mode-ai-human" onclick="setGameMode('ai-vs-human')">🤖 AI (Đỏ) vs 👤 Người (Đen)</button>
        <button id="mode-human-human" onclick="setGameMode('human-vs-human')">👤 Người vs 👤 Người</button>
      </div>

      <div class="section-title">Điều khiển</div>
      <button class="primary" onclick="newGame(currentGameId)">＋ Ván mới</button>

      <div class="toolbar">
        <button onclick="firstMove()" title="Nước đầu">|&lt;</button>
        <button onclick="previousMove()" title="Nước trước">&lt;</button>
        <button onclick="think()" title="AI đi">🤖</button>
        <button onclick="updateBoard()" title="Khôi phục">↻</button>
        <button onclick="nextMove()" title="Nước sau">&gt;</button>
        <button onclick="lastMove()" title="Nước cuối">&gt;|</button>
      </div>

      <div class="options">
        <div class="section-title">Tùy chọn</div>
        <label class="check">
          <input type="checkbox" id="showMoves" checked>
          Hiện nước đi hợp lệ
        </label>
        <label class="check">
          <input type="checkbox" id="flipBoard" onchange="flipBoard()">
          Lật bàn cờ
        </label>

        <button class="action" style="width:100%;margin-top:8px" onclick="setBoardTheme('game/images/boards/board-ccbridge.png')">Bàn gỗ cổ điển</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setBoardTheme('game/images/boards/board_light.svg')">Bàn sáng</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setPieceTheme('traditional_pieces')">Quân truyền thống</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setPieceTheme('romanized_pieces')">Quân ký hiệu</button>
      </div>

      <div class="hint">
        Chế độ mặc định: Người (Đỏ) đấu AI (Đen).<br>
        Có thể nhấn phím <b>E</b> để AI đi khi đến lượt AI.
      </div>
    </aside>
  </main>

  <script src="../engine/wukong.js"></script>
  <script src="game/games.js"></script>
  <script src="game/game_viewer.js"></script>
  <script src="libs/js/isdevtoolopen.js"></script>
  <script>
    // Prevent the old devtools script from changing the new visual theme.
    if (window.devtools) {
      window.addEventListener('devtoolschange', function() {});
    }
  </script>
</body>
</html>
