<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ Tướng</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#fff1cf,#d99a57 55%,#6d3b22);font-family:system-ui,Segoe UI,Arial;color:#3b2415}
.wrap{max-width:1100px;margin:auto}.top{margin-bottom:14px}h1{margin:0;font-size:clamp(28px,4vw,40px)}.sub{opacity:.7}
.layout{display:grid;grid-template-columns:minmax(300px,720px) 300px;gap:18px;align-items:start}
.card{background:rgba(255,248,228,.95);border-radius:18px;padding:14px;box-shadow:0 12px 35px #54290a55}
.board-shell{background:linear-gradient(145deg,#884820,#d18a48,#8b4b27);padding:12px;border-radius:14px}

#xiangqiboard{
  position:relative;
  width:100%;
  aspect-ratio:9/10;
  background:#e7bd78;
  border-radius:8px;
  overflow:hidden;
  box-shadow:inset 0 0 0 2px #5b321d55;
}
.board-lines{
  position:absolute;
  left:5.5%;
  right:5.5%;
  top:5%;
  bottom:5%;
  pointer-events:none;
  z-index:1;
}
.board-lines .hline,
.board-lines .vline{
  position:absolute;
  background:#5b321d;
}
.board-lines .hline{
  left:0;
  right:0;
  height:2px;
  transform:translateY(-1px);
}
.board-lines .vline{
  top:0;
  bottom:0;
  width:2px;
  transform:translateX(-1px);
}
.board-lines .vline.inner{
  bottom:auto;
  height:44.444%;
}
.board-lines .vline.inner.bottom{
  top:auto;
  bottom:0;
  height:44.444%;
}
.board-lines .palace{
  position:absolute;
  width:25%;
  height:22.222%;
  left:37.5%;
}
.board-lines .palace.top{top:0}
.board-lines .palace.bottom{bottom:0}
.board-lines .palace::before,
.board-lines .palace::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:141.5%;
  height:2px;
  background:#5b321d;
  transform-origin:center;
}
.board-lines .palace::before{transform:translate(-50%,-50%) rotate(41.6deg)}
.board-lines .palace::after{transform:translate(-50%,-50%) rotate(-41.6deg)}
#boardGrid{
  position:absolute;
  left:5.5%;
  right:5.5%;
  top:5%;
  bottom:5%;
  z-index:3;
}
.sq{
  position:absolute;
  width:10.8%;
  height:9.6%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:50%;
}
.sq.selected{background:#ffd95c77}
.sq.legal:after{
  content:"";
  width:18%;
  aspect-ratio:1;
  border-radius:50%;
  background:#5c351fcc;
}
.piece{
  width:88%;
  height:88%;
  object-fit:contain;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 2px 1px #0005);
  user-select:none;
}
.river{
  position:absolute;
  z-index:2;
  left:8%;
  right:8%;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-around;
  font-size:clamp(15px,2.5vw,25px);
  font-weight:700;
  pointer-events:none;
  color:#633719aa;
}

@media(max-width:850px){.layout{grid-template-columns:1fr}.controls{order:-1}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>♟ Cờ Tướng</h1><div class="sub">Người chơi hoặc đấu với AI</div></div>
<div class="layout">
<div class="card"><div class="board-shell"><div id="xiangqiboard"><div class="board-lines"><div class="hline" style="top:0.000000%"></div><div class="hline" style="top:11.111111%"></div><div class="hline" style="top:22.222222%"></div><div class="hline" style="top:33.333333%"></div><div class="hline" style="top:44.444444%"></div><div class="hline" style="top:55.555556%"></div><div class="hline" style="top:66.666667%"></div><div class="hline" style="top:77.777778%"></div><div class="hline" style="top:88.888889%"></div><div class="hline" style="top:100.000000%"></div><div class="vline" style="left:0.000000%"></div><div class="vline inner" style="left:12.500000%"></div><div class="vline inner bottom" style="left:12.500000%"></div><div class="vline inner" style="left:25.000000%"></div><div class="vline inner bottom" style="left:25.000000%"></div><div class="vline inner" style="left:37.500000%"></div><div class="vline inner bottom" style="left:37.500000%"></div><div class="vline inner" style="left:50.000000%"></div><div class="vline inner bottom" style="left:50.000000%"></div><div class="vline inner" style="left:62.500000%"></div><div class="vline inner bottom" style="left:62.500000%"></div><div class="vline inner" style="left:75.000000%"></div><div class="vline inner bottom" style="left:75.000000%"></div><div class="vline inner" style="left:87.500000%"></div><div class="vline inner bottom" style="left:87.500000%"></div><div class="vline" style="left:100.000000%"></div><div class="palace top"></div><div class="palace bottom"></div></div><div class="river"><span>楚河</span><span>漢界</span></div><div id="boardGrid"></div></div></div></div>
<div class="card controls">
<div class="status" id="status">Đang khởi tạo…</div>
<div><b>Chế độ chơi</b><div class="mode-grid">
<button id="modeHH" onclick="setGameMode('human-human')">👤 Người vs Người</button>
<button id="modeHA" onclick="setGameMode('human-ai')">👤 Người (Đỏ) vs 🤖 AI</button>
<button id="modeAH" onclick="setGameMode('ai-human')">🤖 AI (Đỏ) vs 👤 Người</button>
</div></div>
<button class="new" onclick="newGame()">↻ Ván mới</button>
<button onclick="flipBoard()">↔ Đổi hướng bàn cờ</button>
<div class="help">Chọn quân rồi chọn ô đích. Ô có chấm là nước đi hợp lệ. AI sẽ tự đi sau lượt của người.</div>
</div>
</div></div>
<script src="../engine/wukong.js"></script>
<script src="game/game_viewer.js"></script>
</body>
</html>
