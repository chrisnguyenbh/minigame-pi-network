<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ Tướng</title>
<style>
:root{
  --bg1:#f6d69b;
  --bg2:#b66d35;
  --panel:#fff8e8;
  --panel2:#f7ead1;
  --wood:#d9a45e;
  --wood-dark:#6e3b1f;
  --line:#5e321c;
  --red:#b51f24;
  --green:#2f7d4a;
  --text:#382214;
  --muted:#7a6657;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#fff1c9 0%,#efbd78 35%,#c17a3e 70%,#8f542f 100%);
  padding:28px 18px 40px;
}
.page{width:min(1080px,100%);margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}
.hero h1{margin:0;font-size:clamp(30px,4vw,46px);line-height:1;font-weight:850;letter-spacing:-1px}
.hero p{margin:8px 0 0;color:#674b39;font-size:15px}
.layout{
  display:grid;
  grid-template-columns:minmax(440px,680px) 310px;
  gap:22px;
  align-items:start;
}
.card{
  background:rgba(255,248,232,.95);
  border:1px solid rgba(98,55,27,.18);
  border-radius:22px;
  box-shadow:0 18px 45px rgba(80,42,18,.22);
}
.board-card{padding:16px}
.board-frame{
  padding:13px;
  border-radius:16px;
  background:linear-gradient(145deg,#8b4a25,#c98242 45%,#7b3e20);
  box-shadow:inset 0 0 0 2px rgba(255,226,173,.22),0 10px 22px rgba(74,37,15,.24);
}
#xiangqiboard{
  position:relative;
  width:100%;
  aspect-ratio:9/10;
  border-radius:10px;
  overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.03)),
    #e4b76f;
  box-shadow:inset 0 0 0 2px rgba(86,45,20,.28);
}
.board-lines{
  position:absolute;
  left:5.6%;
  right:5.6%;
  top:5%;
  bottom:5%;
  z-index:1;
  pointer-events:none;
}
.hline,.vline{position:absolute;background:var(--line);opacity:.9}
.hline{left:0;right:0;height:1.5px;transform:translateY(-.75px)}
.vline{top:0;bottom:0;width:1.5px;transform:translateX(-.75px)}
.vline.inner{bottom:auto;height:44.444%}
.vline.inner.bottom{top:auto;bottom:0;height:44.444%}
.palace{position:absolute;width:25%;height:22.222%;left:37.5%}
.palace.top{top:0}.palace.bottom{bottom:0}
.palace::before,.palace::after{
  content:"";position:absolute;left:50%;top:50%;width:141.5%;height:1.5px;background:var(--line);transform-origin:center
}
.palace::before{transform:translate(-50%,-50%) rotate(41.6deg)}
.palace::after{transform:translate(-50%,-50%) rotate(-41.6deg)}
.river{
  position:absolute;z-index:2;left:9%;right:9%;top:50%;transform:translateY(-50%);
  display:flex;justify-content:space-around;align-items:center;
  font-family:"Times New Roman",serif;font-weight:800;
  font-size:clamp(18px,2.4vw,30px);color:rgba(92,49,26,.65);pointer-events:none
}
#boardGrid{position:absolute;left:5.6%;right:5.6%;top:5%;bottom:5%;z-index:3}
.sq{
  position:absolute;width:10.7%;height:9.5%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%
}
.sq.selected{background:rgba(255,222,75,.42)}
.sq.legal:after{
  content:"";position:absolute;width:14%;aspect-ratio:1;border-radius:50%;
  background:rgba(70,38,20,.62);z-index:1
}
.piece{
  width:86%;height:86%;object-fit:contain;position:relative;z-index:2;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));
  user-select:none;-webkit-user-drag:none;
  transition:transform .12s ease
}
.sq:hover .piece{transform:scale(1.04)}
.side-card{padding:18px;position:sticky;top:18px}
.status{
  display:flex;align-items:center;gap:9px;
  padding:12px 14px;border-radius:13px;
  background:linear-gradient(180deg,#f6e8c9,#eed7ad);
  border:1px solid rgba(103,63,30,.12);
  font-weight:800;font-size:15px;margin-bottom:18px
}
.section-title{font-size:14px;font-weight:800;margin:0 0 9px}
.mode-grid{display:grid;gap:9px}
button{
  width:100%;border:0;border-radius:12px;padding:11px 12px;
  font:inherit;font-weight:750;color:#3c2819;background:#efe3cd;
  cursor:pointer;transition:.16s ease;box-shadow:inset 0 0 0 1px rgba(90,52,27,.08)
}
button:hover{transform:translateY(-1px);filter:brightness(.98)}
button.active{
  color:#fff;background:linear-gradient(180deg,#c72c31,#a8191e);
  box-shadow:0 7px 16px rgba(168,25,30,.22)
}
.new{
  margin-top:13px;color:white;background:linear-gradient(180deg,#3b8a58,#286d43);
  box-shadow:0 7px 16px rgba(40,109,67,.18)
}
.flip{margin-top:9px}
.help{
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(94,50,28,.12);
  color:var(--muted);font-size:13px;line-height:1.55
}
.tips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tip{font-size:11px;padding:5px 8px;border-radius:999px;background:#f3e6cf;color:#6f573f}
@media(max-width:850px){
  body{padding:18px 12px 28px}
  .layout{grid-template-columns:1fr}
  .side-card{position:static;order:-1}
  .hero{align-items:start}
}
@media(max-width:520px){
  .board-card{padding:10px}.board-frame{padding:8px}
  .side-card{padding:14px}.hero h1{font-size:32px}
}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div>
      <h1>♟ Cờ Tướng</h1>
      <p>Chơi cùng bạn bè hoặc thử sức với AI.</p>
    </div>
  </div>

  <div class="layout">
    <section class="card board-card">
      <div class="board-frame">
        <div id="xiangqiboard">
          <div class="board-lines">
            <div class="hline" style="top:0%"></div>
            <div class="hline" style="top:11.111111%"></div>
            <div class="hline" style="top:22.222222%"></div>
            <div class="hline" style="top:33.333333%"></div>
            <div class="hline" style="top:44.444444%"></div>
            <div class="hline" style="top:55.555556%"></div>
            <div class="hline" style="top:66.666667%"></div>
            <div class="hline" style="top:77.777778%"></div>
            <div class="hline" style="top:88.888889%"></div>
            <div class="hline" style="top:100%"></div>

            <div class="vline" style="left:0%"></div>
            <div class="vline inner" style="left:12.5%"></div><div class="vline inner bottom" style="left:12.5%"></div>
            <div class="vline inner" style="left:25%"></div><div class="vline inner bottom" style="left:25%"></div>
            <div class="vline inner" style="left:37.5%"></div><div class="vline inner bottom" style="left:37.5%"></div>
            <div class="vline inner" style="left:50%"></div><div class="vline inner bottom" style="left:50%"></div>
            <div class="vline inner" style="left:62.5%"></div><div class="vline inner bottom" style="left:62.5%"></div>
            <div class="vline inner" style="left:75%"></div><div class="vline inner bottom" style="left:75%"></div>
            <div class="vline inner" style="left:87.5%"></div><div class="vline inner bottom" style="left:87.5%"></div>
            <div class="vline" style="left:100%"></div>

            <div class="palace top"></div>
            <div class="palace bottom"></div>
          </div>

          <div class="river"><span>楚 河</span><span>漢 界</span></div>
          <div id="boardGrid"></div>
        </div>
      </div>
    </section>

    <aside class="card side-card">
      <div class="status" id="status">Đang khởi tạo…</div>

      <div class="section-title">Chế độ chơi</div>
      <div class="mode-grid">
        <button id="modeHH" onclick="setGameMode('human-human')">👥 Người vs Người</button>
        <button id="modeHA" onclick="setGameMode('human-ai')">👤 Người (Đỏ) vs 🤖 AI</button>
        <button id="modeAH" onclick="setGameMode('ai-human')">🤖 AI (Đỏ) vs 👤 Người</button>
      </div>

      <button class="new" onclick="newGame()">↻ Ván mới</button>
      <button class="flip" onclick="flipBoard()">↔ Đổi hướng bàn cờ</button>

      <div class="help">
        Chọn quân của bên đang đi, sau đó chọn giao điểm đích.
        Những vị trí có dấu chấm là nước đi hợp lệ.
        <div class="tips">
          <span class="tip">Đỏ đi trước</span>
          <span class="tip">AI tự động đi</span>
          <span class="tip">Bấm Ván mới để reset</span>
        </div>
      </div>
    </aside>
  </div>
</div>

<script src="../engine/wukong.js"></script>
<script src="game/game_viewer.js"></script>
</body>
</html>
