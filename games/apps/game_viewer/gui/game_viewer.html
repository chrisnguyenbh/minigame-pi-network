<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ Tướng</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#fff1cf,#d99a57 55%,#6d3b22);font-family:system-ui,Segoe UI,Arial;color:#3b2415}
.wrap{max-width:1100px;margin:auto}.top{margin-bottom:14px}h1{margin:0;font-size:clamp(28px,4vw,40px)}.sub{opacity:.7}
.layout{display:grid;grid-template-columns:minmax(300px,720px) 300px;gap:18px;align-items:start}
.card{background:rgba(255,248,228,.95);border-radius:18px;padding:14px;box-shadow:0 12px 35px #54290a55}
.board-shell{background:linear-gradient(145deg,#884820,#d18a48,#8b4b27);padding:12px;border-radius:14px}
#xiangqiboard{position:relative;aspect-ratio:9/10;background:#e7bd78;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px #5b321d55}
#boardGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr);background-image:linear-gradient(#613719bb 1px,transparent 1px),linear-gradient(90deg,#613719bb 1px,transparent 1px);background-size:calc(100% / 8) calc(100% / 9);background-position:center}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.sq.selected{background:#ffd95c66}.sq.legal:after{content:"";width:15%;aspect-ratio:1;border-radius:50%;background:#5c351f88}
.piece{width:82%;height:82%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 2px 1px #0005);user-select:none}
.river{position:absolute;z-index:3;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:space-around;font-size:clamp(15px,2.5vw,25px);font-weight:700;pointer-events:none;color:#633719aa}
.controls{display:flex;flex-direction:column;gap:12px}.status{padding:11px;background:#f0dfbf;border-radius:10px;font-weight:700}
.mode-grid{display:grid;gap:8px;margin-top:8px}button{border:0;border-radius:11px;padding:11px;cursor:pointer;font-weight:700;background:#eadfc9;color:#402616}button.active{background:#b21f1f;color:#fff}.new{background:#2e7147;color:#fff}.help{font-size:13px;line-height:1.5;opacity:.72}
@media(max-width:850px){.layout{grid-template-columns:1fr}.controls{order:-1}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>♟ Cờ Tướng</h1><div class="sub">Người chơi hoặc đấu với AI</div></div>
<div class="layout">
<div class="card"><div class="board-shell"><div id="xiangqiboard"><div class="river"><span>楚河</span><span>漢界</span></div><div id="boardGrid"></div></div></div></div>
<div class="card controls">
<div class="status" id="status">Đang khởi tạo…</div>
<div><b>Chế độ chơi</b><div class="mode-grid">
<button id="modeHH" onclick="setGameMode('human-human')">👤 Người vs Người</button>
<button id="modeHA" onclick="setGameMode('human-ai')">👤 Người (Đỏ) vs 🤖 AI</button>
<button id="modeAH" onclick="setGameMode('ai-human')">🤖 AI (Đỏ) vs 👤 Người</button>
</div></div>
<button class="new" onclick="newGame()">↻ Ván mới</button>
<button onclick="flipBoard()">↔ Đổi hướng bàn cờ</button>
<div class="help">Chọn quân rồi chọn ô đích. Ô có chấm là nước đi hợp lệ. AI sẽ tự đi sau lượt của người.</div>
</div>
</div></div>
<script src="../engine/wukong.js"></script>
<script src="game/game_viewer.js"></script>
</body>
</html>
