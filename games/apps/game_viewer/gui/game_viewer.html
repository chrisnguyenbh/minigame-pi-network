<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cờ Tướng</title>
  <meta name="description" content="Chơi Cờ Tướng với AI hoặc 2 người chơi.">

  <link rel="stylesheet" href="libs/css/bootstrap.min.css">
  <script src="libs/js/jquery.min.js"></script>
  <script src="libs/js/bootstrap.bundle.min.js"></script>

  <style>
    :root {
      --text:#f7ead8; --muted:#cbbba6; --accent:#dfa052;
      --panel:rgba(28,20,15,.94); --panel2:rgba(62,43,28,.95);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      color:var(--text);
      font-family:"Segoe UI",Arial,sans-serif;
      background:radial-gradient(circle at 50% 5%,rgba(154,92,38,.3),transparent 40%),
                 linear-gradient(135deg,#17100c,#2b1b11 50%,#100c09);
      display:flex;justify-content:center;align-items:center;
      padding:18px;
    }
    .game-shell{
      width:min(980px,100%);
      display:grid;grid-template-columns:minmax(420px,1fr) 290px;
      gap:20px;align-items:start;
    }
    .board-card,.side-card{
      background:var(--panel);border:1px solid rgba(223,160,82,.28);
      border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.45);
    }
    .board-card{padding:16px}
    .title{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}
    .title h1{font-size:22px;margin:0;letter-spacing:.4px}
    .brand{color:var(--accent)}
    #turnIndicator{font-size:13px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
    #turnIndicator.ai-turn{color:#ffe0a6;background:rgba(223,160,82,.16)}
    #xiangqiboard{
      width:100%;max-width:506px;margin:auto;aspect-ratio:9/10;
      border:7px solid #70411f;border-radius:10px;overflow:hidden;
      background:url(game/images/boards/board-ccbridge.png) center/100% 100%;
      box-shadow:inset 0 0 0 2px rgba(255,225,170,.35),0 15px 35px rgba(0,0,0,.4)
    }
    #xiangqiboard table{width:100%;height:100%;table-layout:fixed;border-collapse:collapse}
    #xiangqiboard td{padding:0;position:relative;cursor:pointer;transition:filter .12s}
    #xiangqiboard td:hover{filter:brightness(1.08)}
    #xiangqiboard img{width:min(46px,9vw)!important;max-width:90%;user-select:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
    .side-card{padding:18px}
    .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin:0 0 9px}
    .mode-buttons{display:grid;gap:8px;margin-bottom:18px}
    .mode-buttons button{
      border:1px solid rgba(223,160,82,.35);background:rgba(255,255,255,.055);
      color:var(--text);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer
    }
    .mode-buttons button:hover,.mode-buttons button.active{background:rgba(223,160,82,.18);border-color:var(--accent)}
    .primary,.action,.toolbar button{
      border:0;border-radius:9px;padding:9px;background:var(--panel2);color:var(--text);cursor:pointer
    }
    .primary{width:100%;padding:12px;background:linear-gradient(135deg,#e1a04c,#a8662e);color:#21140b;font-weight:800;margin-bottom:12px}
    .toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
    .toolbar button:hover,.action:hover{background:#765034}
    .options{border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
    .check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:9px 0}
    #pgn{display:none}
    .hint{margin-top:15px;color:#9e8e7b;font-size:12px;line-height:1.5}
    @media(max-width:820px){
      body{padding:8px;align-items:flex-start}.game-shell{grid-template-columns:1fr;max-width:540px}
      .side-card{order:2}.board-card{order:1;padding:9px}.title h1{font-size:18px}
      #xiangqiboard{border-width:5px}
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="board-card">
      <div class="title">
        <h1>♜ <span class="brand">Cờ Tướng</span></h1>
        <span id="turnIndicator">♟ Đỏ đi</span>
      </div>
      <div id="xiangqiboard"></div>
      <textarea id="pgn" rows="3" name="text" spellcheck="false"></textarea>
    </section>

    <aside class="side-card">
      <div class="section-title">Chế độ chơi</div>
      <div class="mode-buttons">
        <button id="mode-human-ai" onclick="setGameMode('human-vs-ai')">👤 Người (Đỏ) vs 🤖 AI (Đen)</button>
        <button id="mode-ai-human" onclick="setGameMode('ai-vs-human')">🤖 AI (Đỏ) vs 👤 Người (Đen)</button>
        <button id="mode-human-human" onclick="setGameMode('human-vs-human')">👤 Người vs 👤 Người</button>
      </div>

      <div class="section-title">Điều khiển</div>
      <button class="primary" onclick="newGame(currentGameId)">＋ Ván mới</button>
      <div class="toolbar">
        <button onclick="firstMove()">|&lt;</button>
        <button onclick="previousMove()">&lt;</button>
        <button onclick="think()">🤖</button>
        <button onclick="updateBoard()">↻</button>
        <button onclick="nextMove()">&gt;</button>
        <button onclick="lastMove()">&gt;|</button>
      </div>

      <div class="options">
        <div class="section-title">Tùy chọn</div>
        <label class="check"><input type="checkbox" id="showMoves" checked> Hiện nước đi hợp lệ</label>
        <label class="check"><input type="checkbox" id="flipBoard" onchange="flipBoard()"> Lật bàn cờ</label>
        <button class="action" style="width:100%;margin-top:8px" onclick="setBoardTheme('game/images/boards/board-ccbridge.png')">Bàn gỗ cổ điển</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setBoardTheme('game/images/boards/board_light.svg')">Bàn sáng</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setPieceTheme('traditional_pieces')">Quân truyền thống</button>
        <button class="action" style="width:100%;margin-top:7px" onclick="setPieceTheme('romanized_pieces')">Quân ký hiệu</button>
      </div>
      <div class="hint">Mặc định: Người (Đỏ) đấu AI (Đen).<br>Nhấn <b>E</b> để AI đi khi đến lượt AI.</div>
    </aside>
  </main>

  <script src="New folder/wukong.js"></script>
  <script src="game/games.js"></script>
  <script src="game/game_viewer.js"></script>
  <script src="libs/js/isdevtoolopen.js"></script>
</body>
</html>
