<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tìm điểm khác nhau</title>
<link rel="stylesheet" href="_base.css">
<style>
:root{--purple:#a99be8;--ink:#29251f;--paper:#f4efe6;--green:#15803d;--red:#d43b38}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);background:linear-gradient(180deg,#9d90df,#c0b4f2 55%,#9b8bdc);
}
.game-shell{width:min(760px,100%);margin:0 auto;padding:12px}
.header{
  display:grid;grid-template-columns:80px 1fr 80px;align-items:center;
  background:rgba(255,255,255,.9);border-radius:16px 16px 0 0;padding:10px 12px;
  box-shadow:0 8px 28px #4f438244
}
.header a{text-decoration:none;font-weight:800;color:#5b4ba5}
.title{text-align:center}
.title h1{font-size:20px;margin:0 0 3px}
.level{font-weight:900;font-size:16px}
.progress{display:flex;justify-content:center;gap:7px;margin-top:7px}
.dot{width:18px;height:18px;border-radius:50%;background:#d7d0c7;border:2px solid #aaa097;display:grid;place-items:center;font-size:11px;font-weight:900}
.dot.done{background:#51b96b;border-color:#278c43;color:#fff}
.score{text-align:right;font-weight:900;color:#6252b1}
.stage{
  background:#675f59;padding:10px 9px 14px;border-left:1px solid #ffffff55;border-right:1px solid #ffffff55;
}
.picture{
  position:relative;width:100%;aspect-ratio:16/9;margin:0 auto 8px;overflow:hidden;
  background:#ddd;border:3px solid #49433d;box-shadow:0 2px 0 #ffffff33;
  cursor:crosshair;touch-action:manipulation;
}
.picture svg{display:block;width:100%;height:100%}
.mark{
  position:absolute;width:42px;height:42px;border:4px solid #ffef76;border-radius:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px #e2483c,0 0 12px #fff8;
  pointer-events:none;animation:pop .18s ease-out
}
.hint-mark{animation:pulse .75s infinite alternate;border-color:#fff;background:#ffe94555}
@keyframes pop{from{scale:.4;opacity:.3}to{scale:1;opacity:1}}
@keyframes pulse{to{scale:1.22}}
.bottom{
  background:rgba(255,255,255,.92);border-radius:0 0 16px 16px;padding:10px 12px 13px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  box-shadow:0 8px 28px #4f438244
}
.msg{font-size:13px;color:#665f57;font-weight:700}
.tips{
  border:0;border-radius:14px;background:linear-gradient(#1ca84d,#087a32);color:#fff;
  padding:10px 23px;font-size:18px;font-weight:900;box-shadow:0 4px 0 #075f28;cursor:pointer
}
.next{justify-self:end;border:0;border-radius:10px;background:#6856c8;color:#fff;padding:9px 13px;font-weight:850;cursor:pointer}
.next:disabled{opacity:.35;cursor:not-allowed}
.flash-wrong::after{
  content:"✕";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#ed3030;font-size:70px;font-weight:1000;text-shadow:0 2px #fff;animation:wrong .35s ease-out;pointer-events:none
}
@keyframes wrong{from{scale:.5;opacity:.2}to{scale:1;opacity:0}}
@media(max-width:600px){
  .game-shell{padding:5px}.header{grid-template-columns:55px 1fr 55px;padding:8px}
  .title h1{font-size:17px}.picture{border-width:2px;margin-bottom:5px}.stage{padding:6px}
  .mark{width:34px;height:34px}.bottom{padding:8px}.tips{padding:8px 16px;font-size:15px}
}
</style>
</head>
<body>
<div class="game-shell">
  <div class="header">
    <a href="../">← Hub</a>
    <div class="title">
      <h1>🔎 Tìm Điểm Khác Biệt</h1>
      <div class="level" id="levelLabel">Level 1</div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="score" id="score">0/5</div>
  </div>

  <div class="stage">
    <div class="picture" id="picA"></div>
    <div class="picture" id="picB"></div>
  </div>

  <div class="bottom">
    <div class="msg" id="msg">Tìm 5 điểm khác nhau.</div>
    <button class="tips" id="hintBtn">Tips 💡</button>
    <button class="next" id="nextBtn" disabled>Level tiếp →</button>
  </div>
</div>

<script>
const levels = [
{
 name:'Phòng ngủ ban đêm',
 spots:[[72,23],[20,58],[82,63],[46,77],[58,36]],
 draw(diff=false){return roomScene(diff)}
},
{
 name:'Phòng khách ấm áp',
 spots:[[18,25],[68,26],[83,53],[33,74],[56,67]],
 draw(diff=false){return livingScene(diff)}
},
{
 name:'Nhà bếp',
 spots:[[17,39],[47,22],[80,31],[65,73],[31,70]],
 draw(diff=false){return kitchenScene(diff)}
},
{
 name:'Công viên',
 spots:[[16,34],[44,23],[76,30],[63,69],[28,74]],
 draw(diff=false){return parkScene(diff)}
},
{
 name:'Góc học tập',
 spots:[[20,21],[65,23],[82,50],[43,70],[68,75]],
 draw(diff=false){return studyScene(diff)}
}
];

function roomScene(d){
return `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#a8a7a1"/><stop offset="1" stop-color="#77756f"/></linearGradient><linearGradient id="floor"><stop stop-color="#86512e"/><stop offset="1" stop-color="#60391f"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#wall)"/><polygon points="0,350 800,330 800,450 0,450" fill="url(#floor)"/>
<polygon points="20,60 290,78 290,310 20,345" fill="#8e8c85" stroke="#57554f" stroke-width="7"/>
<rect x="55" y="100" width="190" height="140" fill="#355978" stroke="#c8c0aa" stroke-width="9"/><path d="M150 100v140M55 170h190" stroke="#9fb0b8" stroke-width="5"/>
<circle cx="120" cy="140" r="18" fill="#f3e8b2"/><circle cx="128" cy="137" r="18" fill="#355978"/>
<rect x="86" y="255" width="150" height="70" rx="8" fill="#a36131"/><rect x="110" y="270" width="96" height="18" fill="#3e6e7e"/>
<rect x="280" y="315" width="55" height="60" rx="5" fill="#a15c2d"/><ellipse cx="307" cy="312" rx="40" ry="15" fill="#b9783e"/>
<polygon points="340,205 710,208 760,385 310,385" fill="#62615c" stroke="#4b4945" stroke-width="8"/>
<polygon points="420,195 690,202 718,285 386,282" fill="#77766f"/>
<rect x="455" y="213" width="100" height="55" rx="8" fill="#5f3c24"/><rect x="565" y="214" width="92" height="56" rx="8" fill="${d?'#8b532e':'#6b462e'}"/>
<rect x="330" y="245" width="35" height="112" fill="#76512f"/><path d="M313 245h70l-13-55h-45z" fill="#bc985b"/>
<rect x="595" y="80" width="75" height="55" fill="#665b4e" stroke="#a99671" stroke-width="7"/><circle cx="633" cy="107" r="13" fill="${d?'#d8c841':'#8cb068'}"/>
<rect x="700" y="177" width="55" height="115" fill="#79522e"/><circle cx="728" cy="164" r="32" fill="${d?'#9b6833':'#d5b66d'}"/>
<rect x="140" y="338" width="70" height="18" fill="#493a2c"/><circle cx="154" cy="374" r="29" fill="${d?'#493a2c':'#744727'}"/>
${d?'<rect x="352" y="300" width="55" height="25" rx="4" fill="#2a7d57"/>':'<rect x="352" y="300" width="55" height="25" rx="4" fill="#9e432e"/>'}
<rect x="445" y="330" width="${d?90:120}" height="20" rx="10" fill="#454440"/>
</svg>`}

function livingScene(d){
return `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="450" fill="#d6c19d"/><rect y="335" width="800" height="115" fill="#b67c45"/>
<rect x="45" y="45" width="220" height="160" fill="#7ca7ba" stroke="#faf0d7" stroke-width="11"/><path d="M155 45v160M45 125h220" stroke="#e7e0cf" stroke-width="5"/>
<circle cx="92" cy="82" r="24" fill="${d?'#f5bb42':'#fff0a0'}"/>
<rect x="320" y="60" width="125" height="80" fill="#b98855" stroke="#84603e" stroke-width="8"/><path d="M350 115q32-55 62 0" fill="none" stroke="#4e7954" stroke-width="9"/>
<rect x="560" y="55" width="150" height="80" fill="#987c64" stroke="#f0dbb8" stroke-width="7"/><circle cx="635" cy="95" r="${d?25:15}" fill="#d47851"/>
<rect x="100" y="235" width="265" height="105" rx="22" fill="#9c5b43"/><rect x="135" y="210" width="90" height="70" rx="16" fill="#c17a58"/><rect x="230" y="210" width="90" height="70" rx="16" fill="#d49b62"/>
<rect x="430" y="230" width="220" height="110" rx="18" fill="#8c634c"/><rect x="470" y="206" width="72" height="62" rx="12" fill="#5f8b68"/><rect x="545" y="205" width="70" height="65" rx="12" fill="${d?'#9a5a55':'#e0b55c'}"/>
<ellipse cx="380" cy="362" rx="155" ry="36" fill="#d8c29b"/><rect x="330" y="335" width="105" height="20" rx="10" fill="#7a4d31"/>
<rect x="70" y="205" width="35" height="125" fill="#72502f"/><path d="M45 205h85l-18-55H60z" fill="#d5aa58"/>
<rect x="680" y="200" width="65" height="130" fill="#7f5735"/><g fill="#4b8552"><circle cx="700" cy="185" r="28"/><circle cx="730" cy="175" r="${d?14:25}"/></g>
${d?'<rect x="242" y="350" width="28" height="20" fill="#365d92"/>':'<rect x="242" y="350" width="28" height="20" fill="#b94a43"/>'}
</svg>`}

function kitchenScene(d){
return `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="450" fill="#e6dbc5"/><rect y="330" width="800" height="120" fill="#a77850"/>
<g fill="#b98a5f" stroke="#76563d" stroke-width="5"><rect x="35" y="55" width="140" height="105"/><rect x="190" y="55" width="140" height="105"/><rect x="560" y="55" width="170" height="105"/></g>
<g fill="#efeadf"><rect x="52" y="72" width="106" height="70"/><rect x="207" y="72" width="106" height="70"/><rect x="580" y="72" width="130" height="70"/></g>
<circle cx="105" cy="107" r="${d?23:16}" fill="#d68c4d"/><rect x="240" y="90" width="40" height="${d?35:52}" rx="7" fill="#72a173"/>
<rect x="60" y="205" width="660" height="120" fill="#c79b6d" stroke="#76563d" stroke-width="6"/>
<rect x="70" y="190" width="640" height="25" fill="#625f59"/>
<rect x="310" y="205" width="160" height="72" rx="0 0 28 28" fill="#a8b2b0"/><path d="M375 190q0-48 42-48" fill="none" stroke="#747b7c" stroke-width="11"/>
<rect x="505" y="220" width="120" height="80" fill="#333"/><circle cx="535" cy="245" r="14" fill="#777"/><circle cx="590" cy="245" r="14" fill="${d?'#cc3e3e':'#777'}"/>
<rect x="95" y="225" width="65" height="72" rx="8" fill="#e9e2d2"/><path d="M110 238h35v45h-35z" fill="${d?'#67a6cd':'#d17b47'}"/>
<rect x="650" y="205" width="40" height="90" rx="9" fill="#8ab06e"/><path d="M668 205v-45" stroke="#44734a" stroke-width="7"/><circle cx="650" cy="165" r="18" fill="#5b9d62"/><circle cx="687" cy="165" r="${d?30:18}" fill="#5b9d62"/>
<rect x="220" y="228" width="50" height="16" fill="#f0d56a"/><rect x="220" y="247" width="${d?32:50}" height="16" fill="#d97951"/>
</svg>`}

function parkScene(d){
return `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="450" fill="#8dd7ef"/><circle cx="690" cy="68" r="${d?24:37}" fill="#ffd85d"/><rect y="285" width="800" height="165" fill="#71b85f"/>
<path d="M0 355q180-85 360 0t440 0v95H0z" fill="#d9c18c"/>
<rect x="80" y="150" width="30" height="150" fill="#795134"/><g fill="#4e9f58"><circle cx="95" cy="135" r="65"/><circle cx="48" cy="155" r="${d?30:45}"/><circle cx="145" cy="158" r="48"/></g>
<rect x="600" y="178" width="28" height="125" fill="#765238"/><g fill="#479752"><circle cx="614" cy="160" r="58"/><circle cx="660" cy="175" r="38"/></g>
<rect x="270" y="260" width="170" height="25" rx="10" fill="#825539"/><rect x="290" y="285" width="15" height="75" fill="#63412f"/><rect x="405" y="285" width="15" height="75" fill="#63412f"/>
<circle cx="350" cy="215" r="30" fill="#efc39c"/><rect x="325" y="240" width="52" height="85" rx="16" fill="${d?'#5a78bd':'#c85a55'}"/><rect x="310" y="320" width="22" height="${d?48:65}" fill="#444"/><rect x="370" y="320" width="22" height="65" fill="#444"/>
<circle cx="520" cy="315" r="38" fill="#e8e0c0" stroke="#444" stroke-width="7"/><path d="M493 285l55 60M548 285l-55 60" stroke="#555" stroke-width="4"/>
<path d="M220 80q30-35 60 0q30-35 60 0" fill="none" stroke="${d?'#444':'#fff'}" stroke-width="8"/>
<rect x="150" y="360" width="${d?65:90}" height="14" rx="7" fill="#a35838"/>
</svg>`}

function studyScene(d){
return `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="450" fill="#c8d8d6"/><rect y="340" width="800" height="110" fill="#956847"/>
<rect x="55" y="55" width="150" height="95" fill="#f5f0df" stroke="#805f43" stroke-width="8"/><path d="M88 118l35-38 42 48" fill="none" stroke="${d?'#c84747':'#4f8b59'}" stroke-width="11"/>
<rect x="290" y="60" width="180" height="85" fill="#8c6b50"/><g fill="#e6d7b9"><rect x="305" y="76" width="43" height="55"/><rect x="355" y="76" width="43" height="${d?35:55}"/><rect x="405" y="76" width="43" height="55"/></g>
<rect x="105" y="230" width="570" height="35" rx="6" fill="#744d31"/><rect x="135" y="265" width="25" height="110" fill="#5e3e2b"/><rect x="620" y="265" width="25" height="110" fill="#5e3e2b"/>
<rect x="210" y="155" width="165" height="95" rx="8" fill="#333"/><rect x="222" y="167" width="141" height="70" fill="${d?'#7795ce':'#6ab18a'}"/>
<rect x="400" y="187" width="85" height="55" fill="#efe8d7"/><path d="M412 202h58M412 217h45" stroke="#7e7569" stroke-width="5"/>
<rect x="510" y="165" width="25" height="78" fill="#8b6a4c"/><path d="M480 166h85l-16-55h-53z" fill="#d2a354"/>
<rect x="565" y="180" width="55" height="65" fill="#8e5938"/><g fill="#4f9155"><circle cx="580" cy="162" r="23"/><circle cx="610" cy="155" r="${d?12:25}"/></g>
<circle cx="245" cy="320" r="32" fill="#c68555"/><rect x="215" y="345" width="60" height="25" rx="10" fill="#6b4730"/>
<rect x="440" y="280" width="105" height="20" fill="${d?'#d14c4c':'#506db0'}"/><rect x="460" y="302" width="${d?50:85}" height="18" fill="#d8b55a"/>
</svg>`}

let levelIndex=0, found=new Set(), hintTimer=null;
const picA=document.getElementById('picA'),picB=document.getElementById('picB');
const score=document.getElementById('score'),progress=document.getElementById('progress');
const msg=document.getElementById('msg'),nextBtn=document.getElementById('nextBtn');

function loadLevel(i){
 levelIndex=i;found=new Set();clearTimeout(hintTimer);
 const lv=levels[i];picA.innerHTML=lv.draw(false);picB.innerHTML=lv.draw(true);
 document.getElementById('levelLabel').textContent=`Level ${i+1} · ${lv.name}`;
 updateUI(); nextBtn.disabled=true;
}
function updateUI(){
 const total=levels[levelIndex].spots.length;
 score.textContent=`${found.size}/${total}`;
 progress.innerHTML='';
 for(let i=0;i<total;i++){const d=document.createElement('div');d.className='dot'+(found.has(i)?' done':'');d.textContent=found.has(i)?'✓':'?';progress.appendChild(d)}
 msg.textContent=found.size===total?'🏆 Hoàn thành level!':'Tìm '+(total-found.size)+' điểm khác nhau còn lại.';
 if(found.size===total)nextBtn.disabled=false;
}
function clickPicture(pic,e){
 const rect=pic.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;
 const spots=levels[levelIndex].spots;
 let idx=-1,dist=999;
 spots.forEach((s,i)=>{const dx=x-s[0],dy=y-s[1],d=Math.hypot(dx,dy);if(d<dist){dist=d;idx=i}});
 if(dist<7&&!found.has(idx)){
   found.add(idx);markBoth(idx);updateUI();
 }else if(dist>=7){
   pic.classList.remove('flash-wrong');void pic.offsetWidth;pic.classList.add('flash-wrong');
 }
}
function markBoth(idx, hint=false){
 const [x,y]=levels[levelIndex].spots[idx];
 [picA,picB].forEach(pic=>{
   const m=document.createElement('span');m.className='mark'+(hint?' hint-mark':'');m.style.left=x+'%';m.style.top=y+'%';m.dataset.i=idx;pic.appendChild(m);
 });
}
function clearHint(){
 document.querySelectorAll('.hint-mark').forEach(x=>x.remove())
}
picA.addEventListener('click',e=>clickPicture(picA,e));
picB.addEventListener('click',e=>clickPicture(picB,e));
document.getElementById('hintBtn').onclick=()=>{
 clearHint();
 const todo=levels[levelIndex].spots.map((_,i)=>i).filter(i=>!found.has(i));
 if(!todo.length)return;
 const idx=todo[Math.floor(Math.random()*todo.length)];markBoth(idx,true);
 msg.textContent='💡 Gợi ý đang nhấp nháy trong 2 giây.';
 hintTimer=setTimeout(()=>{clearHint();updateUI()},2000);
};
nextBtn.onclick=()=>loadLevel((levelIndex+1)%levels.length);
loadLevel(0);
</script>
</body>
</html>
