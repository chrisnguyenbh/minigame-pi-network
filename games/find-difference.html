<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tìm điểm khác nhau</title><link rel="stylesheet" href="_base.css"><style>.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scene{position:relative;aspect-ratio:4/3;background:#9cddff;border-radius:18px;overflow:hidden;cursor:crosshair}.obj{position:absolute;width:42px;height:42px;border-radius:50%;background:#ffd84a}.a{left:20%;top:24%}.b{left:65%;top:55%;width:60px;height:30px;background:#62d27e}.c{left:43%;top:70%;width:32px;height:54px;background:#ef6d8d}.d{left:78%;top:18%;width:28px;height:28px;background:#8d67df}.e{left:52%;top:40%;width:25px;height:25px;background:#ff7447}</style></head><body><main class="wrap"><div class="top"><a href="../">← Hub</a><h2>🔎 Tìm điểm khác nhau</h2><span class="score" id="score">0/5</span></div><div class="card"><p class="msg">Bấm vào vị trí khác nhau ở hình bên phải.</p><div class="pair"><div class="scene"><i class="obj a"></i><i class="obj b"></i><i class="obj c"></i><i class="obj d"></i></div><div class="scene" id="right"><i class="obj a"></i><i class="obj b"></i><i class="obj c"></i><i class="obj d"></i><i class="obj e"></i></div></div><p class="msg" id="msg">Đã tìm 0/5</p></div></main><script>let found=0;const spots=[[20,24],[65,55],[43,70],[78,18],[52,40]];right.onclick=e=>{let r=right.getBoundingClientRect(),x=e.offsetX/r.width*100,y=e.offsetY/r.height*100,i=spots.findIndex(([a,b])=>Math.abs(x-a)<7&&Math.abs(y-b)<7);if(i>=0&&!right.dataset['p'+i]){right.dataset['p'+i]=1;found++;score.textContent=found+'/5';msg.textContent=found===5?'🏆 Tìm đủ 5 điểm khác nhau!':'Đã tìm '+found+'/5'}}</script></body></html>
