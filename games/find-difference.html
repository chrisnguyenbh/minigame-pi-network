<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tìm điểm khác nhau</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#9385d8,#b7aaec);font-family:system-ui,Segoe UI,Arial;color:#28231f}
.game{width:min(1380px,100%);margin:auto;padding:7px}header,.foot{background:#fff;padding:10px 12px}
header{border-radius:15px 15px 0 0;display:grid;grid-template-columns:70px 1fr 70px;align-items:center}header a{text-decoration:none;font-weight:800}.center{text-align:center}h2{font-size:19px;margin:0}#level{font-weight:900}#score{text-align:right;font-weight:900}
.dots{display:flex;justify-content:center;gap:6px;margin-top:5px}.dot{width:16px;height:16px;border-radius:50%;background:#d7d1ca;border:2px solid #a59d96}.dot.done{background:#3bb561;border-color:#218543}
.stage{background:#48423f;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}.pic{position:relative;background:#171514;border:2px solid #312c29;overflow:hidden;display:flex;justify-content:center;align-items:center;cursor:crosshair}.pic img{display:block;max-width:100%;width:auto;height:auto;max-height:76vh;object-fit:contain}
.tag{position:absolute;z-index:2;left:8px;top:8px;background:#0009;color:white;padding:4px 8px;border-radius:7px;font-size:12px}
.mark{position:absolute;width:38px;height:38px;border:3px solid #ffe66b;border-radius:50%;box-shadow:0 0 0 3px #e83d38;transform:translate(-50%,-50%);pointer-events:none}.hint{animation:p .55s infinite alternate;background:#ffe94a55}@keyframes p{to{scale:1.22}}
.foot{border-radius:0 0 15px 15px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}button{border:0;border-radius:11px;padding:9px 15px;font-weight:900;cursor:pointer}#hint{background:#078c3a;color:#fff}#next{justify-self:end;background:#6652c6;color:#fff}#next:disabled{opacity:.35}#msg{font-size:12px;font-weight:700;color:#6b625b}
.wrong:after{content:'✕';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:70px;color:#ef3030;font-weight:1000;animation:f .35s;pointer-events:none}@keyframes f{to{opacity:0;scale:1.4}}
@media(max-width:600px){.game{padding:3px}.stage{gap:3px;padding:3px}.pic{border-width:1px}.pic img{width:100%;height:auto;max-height:70vh}.mark{width:27px;height:27px;border-width:2px}}
</style></head><body><div class="game">
<header><a href="../">← Hub</a><div class="center"><h2>🔎 Tìm Điểm Khác Biệt</h2><div id="level"></div><div class="dots" id="dots"></div></div><div id="score"></div></header>
<div class="stage"><div class="pic" id="A"></div><div class="pic" id="B"></div></div>
<div class="foot"><div id="msg"></div><button id="hint">Gợi ý 💡</button><button id="next" disabled>Level tiếp →</button></div></div>
<script>
const levels=[{a:'assets/find-difference/level_01_a.webp',b:'assets/find-difference/level_01_b.webp',spots:[[18,22],[43,15],[59,28],[76,19],[32,46],[53,54]]},
{a:'assets/find-difference/level_02_a.webp',b:'assets/find-difference/level_02_b.webp',spots:[[13,31],[29,18],[49,23],[68,17],[82,34],[38,52]]},
{a:'assets/find-difference/level_03_a.webp',b:'assets/find-difference/level_03_b.webp',spots:[[17,20],[45,9],[51,18],[65,22],[73,39],[40,51]]},
{a:'assets/find-difference/level_04_a.webp',b:'assets/find-difference/level_04_b.webp',spots:[[18,27],[42,15],[57,23],[75,18],[30,45],[62,48]]},
{a:'assets/find-difference/level_05_a.webp',b:'assets/find-difference/level_05_b.webp',spots:[[12,31],[31,19],[48,25],[70,20],[82,40],[37,51]]},
{a:'assets/find-difference/level_06_a.webp',b:'assets/find-difference/level_06_b.webp',spots:[[15,23],[38,14],[55,22],[76,17],[26,45],[48,52]]},
{a:'assets/find-difference/level_07_a.webp',b:'assets/find-difference/level_07_b.webp',spots:[[17,29],[42,15],[58,23],[78,18],[30,43],[51,53]]},
{a:'assets/find-difference/level_08_a.webp',b:'assets/find-difference/level_08_b.webp',spots:[[14,25],[37,13],[54,22],[76,17],[29,43],[48,55]]}];let L=0,found=new Set();const A=document.querySelector('#A'),B=document.querySelector('#B');
function load(i){L=i;found=new Set();A.innerHTML='<b class="tag">HÌNH A</b><img src="'+levels[L].a+'">';B.innerHTML='<b class="tag">HÌNH B</b><img src="'+levels[L].b+'">';next.disabled=true;ui()}
function ui(){let n=levels[L].spots.length;level.textContent='Khó vừa · Level '+(L+1)+' / '+levels.length;score.textContent=found.size+'/'+n;dots.innerHTML=levels[L].spots.map((_,i)=>'<i class="dot '+(found.has(i)?'done':'')+'"></i>').join('');msg.textContent=found.size===n?'🏆 Hoàn thành!':'Còn '+(n-found.size)+' điểm khác nhau.';next.disabled=found.size!==n}
function pos(p,e){let im=p.querySelector('img'),r=im.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return null;return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}
function mark(i,c=''){let[x,y]=levels[L].spots[i];[A,B].forEach(p=>{let im=p.querySelector('img'),ir=im.getBoundingClientRect(),pr=p.getBoundingClientRect(),m=document.createElement('i');m.className='mark '+c;m.style.left=(ir.left-pr.left+ir.width*x/100)+'px';m.style.top=(ir.top-pr.top+ir.height*y/100)+'px';p.appendChild(m)})}
function click(p,e){let q=pos(p,e);if(!q)return;let[x,y]=q,bi=-1,bd=999;levels[L].spots.forEach((s,i)=>{let d=Math.hypot(x-s[0],y-s[1]);if(d<bd){bd=d;bi=i}});if(bd<5.4&&!found.has(bi)){found.add(bi);mark(bi);ui()}else if(bd>=5.4){p.classList.remove('wrong');void p.offsetWidth;p.classList.add('wrong')}}
A.onclick=e=>click(A,e);B.onclick=e=>click(B,e);hint.onclick=()=>{document.querySelectorAll('.hint').forEach(x=>x.remove());let a=levels[L].spots.map((_,i)=>i).filter(i=>!found.has(i));if(!a.length)return;let i=a[Math.floor(Math.random()*a.length)];mark(i,'hint');setTimeout(()=>document.querySelectorAll('.hint').forEach(x=>x.remove()),1800)};next.onclick=()=>load((L+1)%levels.length);load(0);
</script></body></html>
