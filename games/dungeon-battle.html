<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Battle</title><link rel="stylesheet" href="_base.css"></head><body><main class="wrap"><div class="top"><a href="../">← Hub</a><h2>⚔️ Dungeon Battle</h2><span class="score" id="score">0</span></div><div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="card"><h2>🧙 Anh hùng</h2><div class="bar"><i id="hpbar" style="width:100%"></i></div><p>HP: <b id="hp">100</b>/100</p><button class="action" onclick="fight(18+Math.random()*12)">⚔️ Tấn công</button><button class="action" onclick="fight(25+Math.random()*16)">🔥 Kỹ năng</button></div><div class="card"><h2>👹 Boss</h2><div class="bar"><i id="ebar" style="width:100%;background:#e56a72"></i></div><p>HP: <b id="enemy">130</b>/130</p><div class="msg" id="msg">Hạ Boss để thắng!</div></div></div></main><script>let hp=100,e=130,s=0;function fight(d){if(hp<=0||e<=0)return;d=Math.floor(d);e=Math.max(0,e-d);let back=8+Math.floor(Math.random()*15);hp=Math.max(0,hp-back);s+=d;document.getElementById('hp').textContent=hp;document.getElementById('enemy').textContent=e;document.getElementById('hpbar').style.width=hp+'%';document.getElementById('ebar').style.width=e/130*100+'%';document.getElementById('score').textContent=s;if(e<=0)msg.textContent='🏆 BẠN THẮNG!';else if(hp<=0)msg.textContent='💀 Bạn thua. Tải lại để chơi lại.';else msg.textContent=`Bạn gây ${d} damage, Boss phản công ${back}.`}</script><script type="module" src="../assets/core/game-bridge.js"></script>
</body></html>
