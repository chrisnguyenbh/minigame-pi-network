<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Battle</title><link rel="stylesheet" href="_base.css"><style>.battle{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{margin:6px}button:disabled{opacity:.45}@media(max-width:540px){.battle{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="../">← Hub</a><h2>⚔️ Dungeon Battle</h2><span class="score" id="score">0</span></div><h3 id="stage"></h3><div class="battle"><div class="card"><h2>🧙 Anh hùng</h2><div class="bar"><i id="hpbar"></i></div><p>HP: <b id="hp">100</b>/100</p><button class="action" id="attack">⚔️ Tấn công</button><button class="action" id="skill">🔥 Kỹ năng</button><button class="action" id="heal">💚 Hồi máu</button></div><div class="card"><h2>👹 Kẻ địch</h2><div class="bar"><i id="ebar" style="background:#e56a72"></i></div><p>HP: <b id="enemy"></b>/<b id="enemyMax"></b></p></div></div><p class="msg" id="msg" aria-live="polite"></p><button class="action" id="restart">Chơi lại</button></main><script src="../assets/games/dungeon.js"></script><script type="module" src="../assets/core/game-bridge.js"></script></body></html>
