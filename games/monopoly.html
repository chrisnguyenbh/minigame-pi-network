<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monopoly Mini</title>
<style>
:root{--bg:#0e1b27;--panel:#162838;--soft:#20394d;--ink:#f5f6f7;--gold:#ffd166;--green:#2fbf71;--red:#ef476f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b3b50,#0b1721 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:14px}
.app{width:min(1220px,100%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:30px}.top a{color:#cfe9ff;text-decoration:none;font-weight:800}
.setup,.side,.log{background:rgba(18,38,52,.94);border:1px solid #ffffff18;border-radius:16px;padding:13px;box-shadow:0 12px 30px #0005}
.setup{margin-bottom:12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select,input,button{border:0;border-radius:10px;padding:9px 11px;font:inherit;font-weight:750}
button{cursor:pointer;background:#e7edf3;color:#172533}button.primary{background:var(--green);color:#fff}button.danger{background:var(--red);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(650px,1fr) 330px;gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);aspect-ratio:1;background:#d9e6d1;border:7px solid #24382b;border-radius:10px;overflow:hidden;position:relative}
.tile{position:relative;border:1px solid #6b7b6a;background:#f7f5e8;color:#1d2a1f;padding:3px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.tile .name{font-size:9px;font-weight:850;line-height:1.05;text-align:center}.tile .price{font-size:8px;text-align:center;opacity:.7}
.tile .bar{height:7px;margin:-3px -3px 3px;background:#bbb}.tile.corner{background:#e9ead8;justify-content:center}
.tokens{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.token{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0007}
.owner{position:absolute;right:2px;bottom:2px;width:7px;height:7px;border-radius:50%}.houses{font-size:9px;text-align:center;color:#0b7a3a;font-weight:900}
.center{position:absolute;inset:17%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.center-card{background:#fff9;color:#203020;border:2px solid #57715c;padding:18px 25px;border-radius:15px;transform:rotate(-12deg);font-size:32px;font-weight:1000;letter-spacing:2px}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:10px}.turn{font-size:18px;font-weight:900;padding:10px;background:#ffffff0d;border-radius:10px}
.players{display:grid;gap:7px}.player{padding:8px 9px;border-radius:10px;background:#ffffff0b;border-left:5px solid var(--pc)}.player.active{outline:2px solid var(--gold)}.player.bankrupt{opacity:.4;text-decoration:line-through}.ai-badge{font-size:10px;background:#ffffff1c;padding:2px 5px;border-radius:6px;margin-left:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{width:100%}.dice{font-size:34px;text-align:center;min-height:48px}
.property{padding:9px;background:#ffffff0a;border-radius:10px;font-size:13px;line-height:1.45}
.log{margin-top:12px;max-height:180px;overflow:auto;font-size:12px;line-height:1.45}.entry{padding:3px 0;border-bottom:1px solid #ffffff0d}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.board{min-width:680px}.board-wrap{overflow:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>🏙️ Cờ Tỷ Phú Sài Gòn</h1><div>Phiên bản TP.HCM · Chơi với người hoặc AI.</div></div><a href="../">← MiniGame Hub</a></div>

  <div class="setup" id="setup">
    <b>Chế độ:</b>
    <select id="playMode" onchange="updatePlayerSetup()">
      <option value="human-ai" selected>Người vs AI</option>
      <option value="local">Nhiều người cùng máy</option>
    </select>
    <span id="aiSetup">
      <b>Số AI:</b>
      <select id="aiCount"><option value="1" selected>1 AI</option><option value="2">2 AI</option><option value="3">3 AI</option></select>
    </span>
    <span id="localSetup" style="display:none">
      <b>Số người:</b>
      <select id="playerCount"><option>2</option><option>3</option><option selected>4</option></select>
    </span>
    <b>Luật chơi:</b>
    <select id="gameMode"><option value="endless">Chơi đến khi còn 1 người</option><option value="turns">Giới hạn 30 vòng</option><option value="networth">Đạt tài sản $5000</option></select>
    <button class="primary" onclick="startGame()">Bắt đầu</button>
  </div>

  <div class="layout">
    <div class="board-wrap"><div class="board" id="board"><div class="center"><div class="center-card">SÀI GÒN</div></div></div></div>
    <aside class="side">
      <div class="turn" id="turn">Chưa bắt đầu</div>
      <div class="players" id="players"></div>
      <div class="dice" id="dice">🎲 🎲</div>
      <div class="actions">
        <button class="primary" id="rollBtn" onclick="rollDice()" disabled>🎲 Xúc xắc</button>
        <button id="buyBtn" onclick="buyProperty()" disabled>💰 Mua đất</button>
        <button id="buildBtn" onclick="buildHouse()" disabled>🏠 Xây nhà</button>
        <button class="danger" id="endBtn" onclick="endTurn()" disabled>➡ Hết lượt</button>
      </div>
      <div class="property" id="property">Chọn Bắt đầu để chơi.</div>
    </aside>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
const LOCATIONS=[{"id": 0, "type": "START", "name": "KHỞI HÀNH", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 1, "type": "Đất", "name": "Bình Tây", "setId": 1, "cost": 60, "rent": 2, "house": [10, 30, 90, 160], "hotel": 250, "buildCost": 50}, {"id": 2, "type": "Khí vận", "name": "KHÍ VẬN", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 3, "type": "Đất", "name": "Chợ Lớn", "setId": 1, "cost": 60, "rent": 4, "house": [20, 60, 180, 320], "hotel": 500, "buildCost": 50}, {"id": 4, "type": "Thuế", "name": "THUẾ ĐÔ THỊ", "setId": null, "cost": 0, "rent": 200, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 5, "type": "Bến/Ga", "name": "Bến xe Miền Tây", "setId": null, "cost": 200, "rent": 25, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 6, "type": "Đất", "name": "Tân Phú", "setId": 2, "cost": 100, "rent": 6, "house": [30, 90, 270, 480], "hotel": 750, "buildCost": 50}, {"id": 7, "type": "Cơ hội", "name": "CƠ HỘI", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 8, "type": "Đất", "name": "Bình Tân", "setId": 2, "cost": 100, "rent": 6, "house": [30, 90, 270, 480], "hotel": 750, "buildCost": 50}, {"id": 9, "type": "Đất", "name": "Gò Vấp", "setId": 2, "cost": 120, "rent": 8, "house": [40, 120, 360, 640], "hotel": 1000, "buildCost": 50}, {"id": 10, "type": "Thăm nhà giam", "name": "THĂM NHÀ GIAM", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 11, "type": "Đất", "name": "Phú Nhuận", "setId": 3, "cost": 140, "rent": 10, "house": [50, 150, 450, 800], "hotel": 1250, "buildCost": 100}, {"id": 12, "type": "Tiện ích", "name": "Điện lực TP.HCM", "setId": null, "cost": 150, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 13, "type": "Đất", "name": "Tân Bình", "setId": 3, "cost": 140, "rent": 10, "house": [50, 150, 450, 800], "hotel": 1250, "buildCost": 100}, {"id": 14, "type": "Đất", "name": "Bình Thạnh", "setId": 3, "cost": 160, "rent": 12, "house": [60, 180, 540, 960], "hotel": 1500, "buildCost": 100}, {"id": 15, "type": "Bến/Ga", "name": "Ga Sài Gòn", "setId": null, "cost": 200, "rent": 25, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 16, "type": "Đất", "name": "Tân Định", "setId": 4, "cost": 180, "rent": 14, "house": [70, 210, 630, 1120], "hotel": 1750, "buildCost": 100}, {"id": 17, "type": "Khí vận", "name": "KHÍ VẬN", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 18, "type": "Đất", "name": "Đa Kao", "setId": 4, "cost": 180, "rent": 14, "house": [70, 210, 630, 1120], "hotel": 1750, "buildCost": 100}, {"id": 19, "type": "Đất", "name": "Bến Nghé", "setId": 4, "cost": 200, "rent": 16, "house": [80, 240, 720, 1280], "hotel": 2000, "buildCost": 100}, {"id": 20, "type": "Nghỉ miễn phí", "name": "CÔNG VIÊN 23/9", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 21, "type": "Đất", "name": "An Phú", "setId": 5, "cost": 220, "rent": 18, "house": [90, 270, 810, 1440], "hotel": 2250, "buildCost": 150}, {"id": 22, "type": "Cơ hội", "name": "CƠ HỘI", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 23, "type": "Đất", "name": "Thảo Điền", "setId": 5, "cost": 220, "rent": 18, "house": [90, 270, 810, 1440], "hotel": 2250, "buildCost": 150}, {"id": 24, "type": "Đất", "name": "Thủ Thiêm", "setId": 5, "cost": 240, "rent": 20, "house": [100, 300, 900, 1600], "hotel": 2500, "buildCost": 150}, {"id": 25, "type": "Bến/Ga", "name": "Bến xe Miền Đông", "setId": null, "cost": 200, "rent": 25, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 26, "type": "Đất", "name": "Nguyễn Huệ", "setId": 6, "cost": 260, "rent": 22, "house": [110, 330, 990, 1760], "hotel": 2750, "buildCost": 150}, {"id": 27, "type": "Đất", "name": "Bùi Viện", "setId": 6, "cost": 260, "rent": 22, "house": [110, 330, 990, 1760], "hotel": 2750, "buildCost": 150}, {"id": 28, "type": "Tiện ích", "name": "Cấp nước TP.HCM", "setId": null, "cost": 150, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 29, "type": "Đất", "name": "Bến Thành", "setId": 6, "cost": 280, "rent": 24, "house": [120, 360, 1080, 1920], "hotel": 3000, "buildCost": 150}, {"id": 30, "type": "Nhà giam", "name": "VÀO NHÀ GIAM", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 31, "type": "Đất", "name": "Phú Mỹ Hưng", "setId": 7, "cost": 300, "rent": 26, "house": [130, 390, 1170, 2080], "hotel": 3250, "buildCost": 200}, {"id": 32, "type": "Đất", "name": "Nguyễn Văn Linh", "setId": 7, "cost": 300, "rent": 26, "house": [130, 390, 1170, 2080], "hotel": 3250, "buildCost": 200}, {"id": 33, "type": "Khí vận", "name": "KHÍ VẬN", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 34, "type": "Đất", "name": "Sala Đại Quang Minh", "setId": 7, "cost": 320, "rent": 28, "house": [140, 420, 1260, 2240], "hotel": 3500, "buildCost": 200}, {"id": 35, "type": "Bến/Ga", "name": "Bến Bạch Đằng", "setId": null, "cost": 200, "rent": 25, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 36, "type": "Cơ hội", "name": "CƠ HỘI", "setId": null, "cost": 0, "rent": 0, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 37, "type": "Đất", "name": "Đồng Khởi", "setId": 8, "cost": 350, "rent": 35, "house": [175, 525, 1575, 2800], "hotel": 4375, "buildCost": 200}, {"id": 38, "type": "Thuế", "name": "THUẾ TÀI SẢN", "setId": null, "cost": 0, "rent": 100, "house": [0, 0, 0, 0], "hotel": 0, "buildCost": 0}, {"id": 39, "type": "Đất", "name": "Lê Lợi", "setId": 8, "cost": 400, "rent": 50, "house": [250, 750, 2250, 4000], "hotel": 6250, "buildCost": 200}];
const SET_COLORS={1:'#6b4b3e',2:'#8bd3e6',3:'#d789d7',4:'#f4d35e',5:'#ef6f6c',6:'#f4a261',7:'#55a868',8:'#4b7bec'};
const PLAYER_COLORS=['#e63946','#2a9d8f','#457b9d','#9b5de5','#ff9f1c','#00b4d8','#f15bb5','#84a98c'];

let state=null;

function money(n){return '$'+Math.round(n)}
function log(msg){const e=document.createElement('div');e.className='entry';e.textContent=msg;document.getElementById('log').prepend(e)}
function locByPos(pos){return LOCATIONS[pos%40]}
function current(){return state.players[state.current]}

function updatePlayerSetup(){
  const ai=playMode.value==='human-ai';
  aiSetup.style.display=ai?'inline':'none';
  localSetup.style.display=ai?'none':'inline';
}
function startGame(){
  const aiMode=playMode.value==='human-ai';
  const n=aiMode ? 1+(+aiCount.value) : +playerCount.value;
  const mode=gameMode.value;
  state={mode,round:1,current:0,rolled:false,doubleCount:0,pendingBuy:false,gameOver:false,properties:{},players:[]};
  for(let i=0;i<n;i++){
    state.players.push({
      name: aiMode ? (i===0?'Bạn':'AI '+i) : 'Người '+(i+1),
      cash:1500,pos:0,jail:0,bankrupt:false,color:PLAYER_COLORS[i],laps:0,
      ai: aiMode && i>0
    });
  }
  setup.style.display='none';
  document.getElementById('log').innerHTML='';
  renderBoard();renderAll();log('🏙️ Ván Cờ Tỷ Phú Sài Gòn bắt đầu!');
  maybeAiTurn();
}

function boardIndexStyle(i){
  // positions 0..39 clockwise: bottom-right -> bottom-left -> top-left -> top-right -> bottom-right
  if(i<=10) return {row:11,col:11-i};
  if(i<=20) return {row:11-(i-10),col:1};
  if(i<=30) return {row:1,col:i-20+1};
  return {row:i-30+1,col:11};
}

function renderBoard(){
  const b=document.getElementById('board');
  b.querySelectorAll('.tile').forEach(x=>x.remove());
  for(let i=0;i<40;i++){
    const loc=LOCATIONS[i],st=boardIndexStyle(i),d=document.createElement('div');
    d.className='tile'+([0,10,20,30].includes(i)?' corner':'');
    d.style.gridRow=st.row;d.style.gridColumn=st.col;d.dataset.i=i;
    if(loc.setId) d.innerHTML+=`<div class="bar" style="background:${SET_COLORS[loc.setId]}"></div>`;
    d.innerHTML+=`<div class="name">${loc.name}</div>`;
    if(loc.cost)d.innerHTML+=`<div class="price">${money(loc.cost)}</div>`;
    d.innerHTML+=`<div class="houses"></div><div class="tokens"></div>`;
    b.appendChild(d);
  }
}

function renderAll(){
  if(!state)return;
  document.querySelectorAll('.tokens').forEach(x=>x.innerHTML='');
  document.querySelectorAll('.owner').forEach(x=>x.remove());
  document.querySelectorAll('.houses').forEach(x=>x.textContent='');

  state.players.forEach((p,idx)=>{
    if(p.bankrupt)return;
    const tile=document.querySelector(`.tile[data-i="${p.pos}"] .tokens`);
    if(tile)tile.innerHTML+=`<i class="token" style="background:${p.color}"></i>`;
  });

  Object.entries(state.properties).forEach(([pos,pr])=>{
    const tile=document.querySelector(`.tile[data-i="${pos}"]`);
    if(!tile)return;
    const owner=state.players[pr.owner];
    const dot=document.createElement('i');dot.className='owner';dot.style.background=owner.color;tile.appendChild(dot);
    if(pr.houses)tile.querySelector('.houses').textContent=pr.houses>=5?'🏨':'🏠'.repeat(pr.houses);
  });

  players.innerHTML=state.players.map((p,i)=>`<div class="player ${i===state.current?'active':''} ${p.bankrupt?'bankrupt':''}" style="--pc:${p.color}"><b>${p.name}</b> · ${p.cash} · Ô ${p.pos+1}${p.jail?' · 🔒 Jail':''}</div>`).join('');
  const p=current(),loc=locByPos(p.pos);
  turn.textContent=state.gameOver?'Ván đã kết thúc':`Vòng ${state.round} · ${p.name}`;
  const typeLabel={
    START:'Khởi hành',PROPERTY:'Bất động sản',RAIL:'Bến / Ga',
    UTILITY:'Tiện ích',TAX:'Thuế',CHANCE:'Cơ hội',CHEST:'Khí vận',
    JAIL:'Nhà giam',FREE:'Nghỉ miễn phí',VISIT:'Thăm nhà giam'
  }[loc.type]||loc.type;
  property.innerHTML=`<b>${loc.name}</b><br>Loại ô: ${typeLabel}${loc.cost?` · Giá ${money(loc.cost)}`:''}${loc.rent?` · Thuê gốc ${money(loc.rent)}`:''}`;

  rollBtn.disabled=state.gameOver||state.rolled||p.bankrupt||p.ai;
  buyBtn.disabled=!state.pendingBuy||p.cash<loc.cost||p.ai;
  buildBtn.disabled=!canBuild(p,loc)||p.ai;
  endBtn.disabled=state.gameOver||!state.rolled||p.ai;
}


function aiPropertyScore(loc,pos){
  let score=0;
  if(loc.type==='PROPERTY'){
    score += loc.rent*8 + loc.cost*.35;
    // Strongly value completing or approaching a color set.
    const set=LOCATIONS.map((x,i)=>x.setId===loc.setId?i:null).filter(x=>x!==null);
    const mine=set.filter(i=>state.properties[i]&&state.properties[i].owner===state.current).length;
    if(mine===set.length-1)score+=900;
    else if(mine>0)score+=180*mine;
  }else if(loc.type==='RAIL'){
    const mine=Object.entries(state.properties).filter(([k,v])=>v.owner===state.current&&LOCATIONS[k].type==='RAIL').length;
    score=260+mine*180;
  }else if(loc.type==='UTILITY')score=150;
  return score;
}

function aiShouldBuy(p,loc){
  if(!loc.cost||p.cash<loc.cost)return false;
  const reserve=Math.max(220,Math.min(500,loc.cost*.9));
  const score=aiPropertyScore(loc,p.pos);
  // AI may spend deeper when completing a monopoly.
  return (p.cash-loc.cost>=reserve && score>=loc.cost*.65) || score>700;
}

function aiBuildBest(){
  const p=current();
  let choices=[];
  Object.entries(state.properties).forEach(([k,pr])=>{
    const pos=+k,loc=LOCATIONS[pos];
    if(pr.owner!==state.current||loc.type!=='PROPERTY'||!ownsFullSet(state.current,loc.setId)||pr.houses>=5)return;
    if(p.cash<loc.buildCost+250)return;
    const nextRent=pr.houses>=4?loc.hotel:loc.house[pr.houses];
    const oldRent=pr.houses===0?loc.rent:loc.house[pr.houses-1];
    choices.push({pos,pr,loc,gain:(nextRent||0)-(oldRent||0)});
  });
  choices.sort((a,b)=>(b.gain/b.loc.buildCost)-(a.gain/a.loc.buildCost));
  if(!choices.length)return false;
  const x=choices[0];
  p.cash-=x.loc.buildCost;x.pr.houses++;
  log(`🤖 ${p.name} xây ${x.pr.houses===5?'khách sạn':'nhà'} tại ${x.loc.name}.`);
  return true;
}

function maybeAiTurn(){
  if(!state||state.gameOver)return;
  const p=current();
  if(!p.ai)return;
  renderAll();
  setTimeout(aiTakeTurn,650);
}

function aiTakeTurn(){
  if(!state||state.gameOver||!current().ai)return;
  const p=current();

  // Roll/move using the same rules as human.
  rollDice();

  setTimeout(()=>{
    if(!state||state.gameOver||!current().ai)return;
    const p=current(),loc=locByPos(p.pos);

    if(state.pendingBuy && aiShouldBuy(p,loc)) buyProperty();

    // Build up to two profitable houses per turn while maintaining cash reserve.
    let builds=0;
    while(builds<2 && aiBuildBest()) builds++;

    renderAll();
    setTimeout(()=>endTurn(),700);
  },700);
}

function rollDice(){
  if(!state||state.gameOver||state.rolled)return;
  const p=current();
  if(p.jail>0){
    const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);dice.textContent=`🎲 ${a} + 🎲 ${b}`;
    if(a===b){p.jail=0;log(`${p.name} tung đôi và ra khỏi tù!`)}
    else{p.jail--;state.rolled=true;log(`${p.name} còn ${p.jail} lượt trong tù.`);renderAll();return}
  }

  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),sum=d1+d2;
  dice.textContent=`🎲 ${d1} + 🎲 ${d2} = ${sum}`;state.rolled=true;
  const old=p.pos,pNew=(p.pos+sum)%40;
  if(p.pos+sum>=40){p.cash+=200;p.laps++;log(`${p.name} qua KHỞI HÀNH và nhận $200.`)}
  p.pos=pNew;log(`${p.name} đi ${sum} ô tới ${locByPos(p.pos).name}.`);
  resolveLanding();
}

function resolveLanding(){
  const p=current(),loc=locByPos(p.pos);state.pendingBuy=false;
  const owned=state.properties[p.pos];

  if(loc.type==='Đất'||loc.type==='Bến/Ga'||loc.type==='Tiện ích'){
    if(!owned){state.pendingBuy=true;log(`${loc.name} chưa có chủ. Có thể mua với ${loc.cost}.`)}
    else if(owned.owner!==state.current){
      let rent=calcRent(p.pos,owned);
      payTo(state.current,owned.owner,rent);
      log(`${p.name} trả ${rent} tiền thuê cho ${state.players[owned.owner].name}.`);
    }
  } else if(loc.type==='Thuế'){
    const amt=loc.rent||100;p.cash-=amt;log(`${p.name} nộp thuế ${amt}.`);
  } else if(loc.type==='Cơ hội'||loc.type==='Khí vận'){
    drawCard(loc.type);
  } else if(loc.type==='Nhà giam'){
    p.pos=10;p.jail=3;log(`${p.name} bị đưa vào tù trong tối đa 3 lượt.`);
  }
  checkBankruptcy(p);checkWin();renderAll();
}

function calcRent(pos,pr){
  const loc=LOCATIONS[pos];
  if(loc.type==='Đất'){
    if(pr.houses>=5)return loc.hotel||loc.rent*25;
    if(pr.houses>0)return loc.house[pr.houses-1]||loc.rent;
    if(ownsFullSet(pr.owner,loc.setId))return loc.rent*2;
  }
  if(loc.type==='Bến/Ga'){
    const count=Object.entries(state.properties).filter(([k,v])=>v.owner===pr.owner&&LOCATIONS[k].type==='Bến/Ga').length;
    return 25*Math.pow(2,Math.max(0,count-1));
  }
  if(loc.type==='Tiện ích')return 50;
  return loc.rent;
}

function buyProperty(){
  const p=current(),loc=locByPos(p.pos);
  if(!state.pendingBuy||p.cash<loc.cost)return;
  p.cash-=loc.cost;state.properties[p.pos]={owner:state.current,houses:0};
  state.pendingBuy=false;log(`${p.name} mua ${loc.name} với ${loc.cost}.`);renderAll();
}

function ownsFullSet(owner,setId){
  if(!setId)return false;
  const ids=LOCATIONS.map((x,i)=>x.setId===setId?i:null).filter(x=>x!==null);
  return ids.every(i=>state.properties[i]&&state.properties[i].owner===owner);
}

function canBuild(p,loc){
  if(!state||state.gameOver||!state.rolled||loc.type!=='Đất')return false;
  const pr=state.properties[p.pos];
  return !!(pr&&pr.owner===state.current&&ownsFullSet(state.current,loc.setId)&&pr.houses<5&&p.cash>=loc.buildCost);
}

function buildHouse(){
  const p=current(),loc=locByPos(p.pos),pr=state.properties[p.pos];
  if(!canBuild(p,loc))return;
  p.cash-=loc.buildCost;pr.houses++;
  log(`${p.name} xây ${pr.houses===5?'khách sạn':'nhà'} tại ${loc.name}.`);
  renderAll();
}

function drawCard(type){
  const p=current();
  const cards=[
    {t:'Nhận $100',fn:()=>p.cash+=100},
    {t:'Trả $50',fn:()=>p.cash-=50},
    {t:'Nhận $200',fn:()=>p.cash+=200},
    {t:'Về KHỞI HÀNH, nhận $200',fn:()=>{p.pos=0;p.cash+=200}},
    {t:'Đi tù',fn:()=>{p.pos=10;p.jail=3}},
    {t:'Trả $100',fn:()=>p.cash-=100},
    {t:'Nhận $50',fn:()=>p.cash+=50},
  ];
  const c=cards[Math.floor(Math.random()*cards.length)];c.fn();log(`${type==='CHEST'?'KHÍ VẬN':'CƠ HỘI'}: ${c.t}.`);
}

function payTo(from,to,amt){
  const a=state.players[from],b=state.players[to];
  a.cash-=amt;b.cash+=amt;checkBankruptcy(a);
}

function checkBankruptcy(p){
  if(p.cash>=-500||p.bankrupt)return;
  p.bankrupt=true;log(`💥 ${p.name} phá sản!`);
  Object.keys(state.properties).forEach(k=>{if(state.properties[k].owner===state.players.indexOf(p))delete state.properties[k]});
}

function endTurn(){
  if(!state||state.gameOver||!state.rolled)return;
  state.rolled=false;state.pendingBuy=false;
  let next=state.current,loops=0;
  do{next=(next+1)%state.players.length;if(next===0)state.round++;loops++}while(state.players[next].bankrupt&&loops<=state.players.length);
  state.current=next;dice.textContent='🎲 🎲';checkWin();renderAll();maybeAiTurn();
}

function checkWin(){
  const active=state.players.filter(p=>!p.bankrupt);
  if(state.mode==='endless'&&active.length===1)finish(`${active[0].name} là người sống sót cuối cùng!`);
  if(state.mode==='turns'&&state.round>30){
    const w=[...active].sort((a,b)=>netWorth(b)-netWorth(a))[0];finish(`Hết 30 vòng. ${w.name} thắng với tài sản ${money(netWorth(w))}.`);
  }
  if(state.mode==='networth'){
    const w=active.find(p=>netWorth(p)>=5000);if(w)finish(`${w.name} đạt tài sản $5000 và chiến thắng!`);
  }
}

function netWorth(p){
  let v=p.cash,idx=state.players.indexOf(p);
  Object.entries(state.properties).forEach(([k,pr])=>{if(pr.owner===idx){const l=LOCATIONS[k];v+=l.cost+(pr.houses||0)*l.buildCost}});
  return v;
}

function finish(msg){state.gameOver=true;log('🏆 '+msg);turn.textContent='🏆 '+msg}

renderBoard();
</script>
