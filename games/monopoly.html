<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cờ Tỷ Phú Sài Gòn</title>
<style>
:root{--bg:#06101b;--panel:#0b1624;--line:#ffffff1a;--cream:#fff3cf;--ink:#171718;--gold:#f7be28}
*{box-sizing:border-box}html,body{margin:0;background:#06101b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#183654,#06101b 55%,#040a11)}
button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.app{width:min(1520px,100%);margin:auto;padding:6px 8px 10px}
.header{height:62px;display:grid;grid-template-columns:230px 1fr 210px;align-items:center}
.brand{font-size:26px;line-height:.92;font-weight:1000;color:#ffc638;text-shadow:0 3px 10px #000}.brand span{display:block;color:#31cf7a;font-size:19px;margin-top:5px}
.header-nav{display:flex;justify-content:center;gap:8px}.header-nav button,.hub-link,.header-right button{border:1px solid #ffffff20;background:#0b1725;color:#fff;border-radius:10px;padding:8px 14px;font-weight:850;text-decoration:none}.header-right{display:flex;justify-content:flex-end;gap:6px}
.setup{background:#0b1725;border:1px solid #ffffff17;border-radius:10px;padding:7px 9px;margin-bottom:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px}.setup select,.setup button{border:0;border-radius:7px;padding:6px 8px}.setup button{background:#24a95e;color:#fff;font-weight:900}

.game-layout{display:grid;grid-template-columns:205px minmax(760px,1fr) 218px;gap:8px;align-items:start}
.panel{background:linear-gradient(180deg,#0a1523,#07101a);border:1px solid #ffffff1b;border-radius:13px;box-shadow:0 14px 34px #0005}
.left-panel,.right-panel{padding:8px}.panel-title{font-size:14px;font-weight:1000;color:#ffe6a6;margin:2px 0 7px}
.players{display:grid;gap:6px}
.player{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;min-height:72px;border:2px solid var(--pc);border-radius:10px;padding:5px;background:#ffffff07}
.player.active{box-shadow:0 0 0 2px #ffd53d inset,0 0 18px #ffc10733}.player.bankrupt{opacity:.3;filter:grayscale(1)}
.player-avatar{width:48px;height:62px;object-fit:contain;filter:drop-shadow(0 5px 3px #0009);background:transparent;border:0}
.player-name{font-size:13px;font-weight:950}.player-money{font-size:17px;font-weight:1000;color:var(--pc)}.player-meta{font-size:9px;color:#b6c1cb}.ai-badge{font-size:8px;background:#ffffff18;padding:1px 4px;border-radius:4px}
.info-card{margin-top:7px;background:#ffffff07;border-radius:9px;padding:8px;font-size:10px;line-height:1.45}

.board-shell{display:flex;flex-direction:column;gap:6px;min-width:0}.board-wrap{overflow:auto}
.board{
 --corner:86px;--h:69px;--v:58px;
 position:relative;margin:auto;
 width:calc(var(--corner)*2 + var(--h)*9);height:calc(var(--corner)*2 + var(--v)*9);
 display:grid;grid-template-columns:var(--corner) repeat(9,var(--h)) var(--corner);grid-template-rows:var(--corner) repeat(9,var(--v)) var(--corner);
 background:#d9c8a5;border:6px solid #8f6631;border-radius:16px;box-shadow:0 20px 42px #000a,inset 0 0 0 2px #fff6;overflow:visible
}
.tile{position:relative;background:linear-gradient(#fff7dc,#eeddb9);color:var(--ink);border:1px solid #6e5b46;padding:4px 3px;display:flex;flex-direction:column;justify-content:space-between;overflow:visible;z-index:2}
.tile.corner{background:linear-gradient(145deg,#fff9df,#e7d4a6);justify-content:center}.tile .bar{height:11px;margin:-4px -3px 2px;border-bottom:1px solid #0002}.tile .name{font-size:9px;font-weight:1000;line-height:1.02;text-align:center}.tile .price{font-size:8px;text-align:center;font-weight:850}.tile.event::after{content:"?";font-size:24px;color:#e33440;text-align:center;font-weight:1000}.tile.chest::after{content:"🧰";font-size:19px;text-align:center}
.houses{font-size:8px;text-align:center;color:#087a36;font-weight:1000;min-height:8px}.owner{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;border:1px solid #fff}
.tokens{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:30;display:flex;overflow:visible;pointer-events:none}
.chibi-token{width:68px;height:88px;overflow:visible;filter:drop-shadow(0 8px 5px #000b);transform-origin:50% 90%;transition:transform .15s}.chibi-token.active{transform:translateY(-11px) scale(1.08)}.chibi-token img{width:100%;height:100%;object-fit:contain;border:0;border-radius:0;background:transparent}

.center-scene{position:absolute;left:var(--corner);right:var(--corner);top:var(--corner);bottom:var(--corner);z-index:1;border:2px solid #6f5137;background:
 linear-gradient(#06101b22,#02070c55),url('../assets/monopoly/reference_ui.png') center 48%/cover no-repeat;overflow:hidden}
.center-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#06162b10,#06152118 55%,#020a1266);pointer-events:none}
.skyline{display:none}.saigon-title{position:absolute;z-index:2;left:0;right:0;top:31%;text-align:center;font-size:48px;font-weight:1000;letter-spacing:2px;color:#f8d68a;text-shadow:0 4px 0 #654621,0 10px 24px #000}
.center-dice{position:absolute;z-index:3;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;gap:18px;filter:drop-shadow(0 12px 9px #000b)}.die3d{display:grid;place-items:center;width:82px;height:82px;border-radius:16px;background:linear-gradient(145deg,#fffdf3,#e9ddc7);border:2px solid #fff;color:#161616;font-size:64px;line-height:1;box-shadow:inset -8px -10px 15px #9c8b7255,inset 5px 5px 10px #fff,0 7px 0 #b9a98e,0 12px 20px #0008;transform:rotate(-7deg)}.die3d+ .die3d{transform:rotate(7deg)}
.spin-button{position:absolute;z-index:4;left:50%;top:76%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;border:7px solid #ffd84b;background:radial-gradient(circle at 38% 25%,#70ef63 0 10%,#25b83e 38%,#08752a 78%);color:#fff;font-size:30px;font-weight:1000;text-shadow:0 2px 3px #06491f;box-shadow:inset 0 0 0 4px #ffffff38,inset 0 -12px 20px #004d22aa,0 0 0 5px #986a16,0 0 32px #ffd43bcc,0 12px 20px #000a}.spin-button small{display:block;font-size:9px;margin-top:2px}

.right-panel{display:flex;flex-direction:column;gap:7px}.turn-card,.current-card,.property-card{background:#ffffff07;border-radius:9px;padding:8px}.turn-card h3,.current-card h3{margin:0 0 5px;font-size:13px}.dice-readout{text-align:center;font-size:20px;font-weight:1000}.actions{display:grid;gap:5px}.actions button{width:100%;border:0;border-radius:8px;padding:9px 6px;font-size:13px;font-weight:1000;color:#fff}
#rollBtn{background:linear-gradient(#188fec,#0862b9)}#buyBtn{background:linear-gradient(#f7bc20,#d38d00);color:#221500}#buildBtn{background:linear-gradient(#43c64b,#12842d)}#cardBtn{background:linear-gradient(#a45be2,#6631a6)}#endBtn{background:linear-gradient(#ed4444,#b51c1c)}
.current-symbol{font-size:38px;text-align:center;color:#f34a55}.property-card{font-size:10px;line-height:1.4}

.bottom-grid{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:6px}.bottom-box{background:#091522;border:1px solid #ffffff17;border-radius:10px;padding:8px;min-height:88px}.bottom-box h3{font-size:12px;margin:0 0 5px}
.card-decks{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}.deck{border:2px solid currentColor;background:#151823;color:#fff;border-radius:10px;padding:6px;min-height:74px;text-align:center;font-weight:1000}.deck.red{color:#ff5665}.deck.blue{color:#4db8ff}.deck.enabled{cursor:pointer;box-shadow:0 0 0 2px currentColor,0 0 20px currentColor}.deck.disabled{opacity:.3}.deck .icon{font-size:27px;display:block}.deck small{font-size:9px;color:#fff9}.or{font-size:11px;font-weight:1000}.log{max-height:84px;overflow:auto;font-size:9px;line-height:1.4}.entry{padding:2px 0;border-bottom:1px solid #ffffff0d}

.modal{position:fixed;inset:0;background:#020710c9;display:none;align-items:center;justify-content:center;z-index:999;padding:18px}.modal.show{display:flex}.event-popup{width:min(410px,100%);background:linear-gradient(180deg,#fff4d5,#f2d9a7);color:#281a10;border-radius:18px;border:5px solid #d79a3e;box-shadow:0 28px 70px #000b;overflow:hidden;text-align:center}.event-head{padding:11px;font-size:23px;font-weight:1000;color:#fff}.event-head.chance{background:linear-gradient(#ed493d,#c61e25)}.event-head.fortune{background:linear-gradient(#2698e8,#1465ad)}.event-body{padding:19px}.event-icon{font-size:54px}.event-body h2{margin:7px 0 5px}.event-body p{font-size:16px}.event-close{margin:0 0 15px;border:0;border-radius:9px;background:#c92c2c;color:#fff;padding:9px 34px;font-weight:1000}

@media(max-width:1200px){.game-layout{grid-template-columns:180px minmax(700px,1fr) 190px}.board{--corner:80px;--h:63px;--v:54px}.chibi-token{width:62px;height:80px}.saigon-title{font-size:42px}}
@media(max-width:900px){.header{grid-template-columns:1fr auto}.header-nav{display:none}.game-layout{display:block}.left-panel,.right-panel{margin-bottom:6px}.players{grid-template-columns:repeat(2,1fr)}.board{min-width:780px}.bottom-grid{grid-template-columns:1fr}.right-panel{display:grid;grid-template-columns:1fr 1fr}.actions{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">🏙️ CỜ TỶ PHÚ<span>SÀI GÒN</span></div>
    <div class="header-nav"><button>📖 Quy tắc</button><button>↶ Lịch sử</button><button>⚙ Cài đặt</button></div>
    <div class="header-right"><a class="hub-link" href="../">🎮 Hub</a><button>🔊</button><button>☰</button></div>
  </header>

  <div class="setup" id="setup">
    <b>Chế độ:</b>
    <select id="playMode" onchange="updatePlayerSetup()">
      <option value="human-ai" selected>Người vs AI</option>
      <option value="local">Nhiều người cùng máy</option>
    </select>
    <span id="aiSetup"><b>Số AI:</b>
      <select id="aiCount"><option value="1">1 AI</option><option value="2">2 AI</option><option value="3" selected>3 AI</option></select>
    </span>
    <span id="localSetup" style="display:none"><b>Số người:</b>
      <select id="playerCount"><option>2</option><option>3</option><option selected>4</option></select>
    </span>
    <b>Luật:</b>
    <select id="gameMode"><option value="endless">Đến khi còn 1 người</option><option value="turns" selected>20 vòng</option><option value="networth">Đạt $5000</option></select>
    <button onclick="startGame()">Bắt đầu ván</button>
  </div>

  <main class="game-layout">
    <aside class="panel left-panel">
      <div class="panel-title">NGƯỜI CHƠI</div>
      <div class="players" id="players"></div>
      <div class="info-card"><b>THÔNG TIN</b><br><span id="gameInfo">Chưa bắt đầu.</span></div>
    </aside>

    <section class="board-shell">
      <div class="board-wrap">
        <div class="board" id="board">
          <div class="center-scene">
            <div class="skyline">
              <i class="bld" style="height:45%"></i><i class="bld" style="height:70%"></i><i class="bld" style="height:54%"></i>
              <i class="bld" style="height:87%"></i><i class="bld" style="height:61%"></i><i class="bld" style="height:79%"></i>
              <i class="bld" style="height:47%"></i><i class="bld" style="height:91%"></i><i class="bld" style="height:63%"></i>
            </div>
            <div class="saigon-title">SÀI GÒN</div>
            <div class="center-dice" id="centerDice"><span class="die3d">⚄</span><span class="die3d">⚀</span></div>
            <button class="spin-button" id="centerRoll" onclick="rollDice()" disabled>QUAY<small>Nhấn để đổ xúc xắc</small></button>
          </div>
        </div>
      </div>

      <div class="bottom-grid">
        <div class="bottom-box">
          <h3 id="landingTitle">🎲 Sẵn sàng</h3>
          <div id="landingText">Đổ xúc xắc và di chuyển chibi quanh Sài Gòn.</div>
        </div>

        <div class="bottom-box card-decks">
          <button class="deck red disabled" id="chanceDeck" onclick="chooseEventCard('Cơ hội')">
            <span>CƠ HỘI</span><span class="icon">❓</span><small>Nhấn để chọn</small>
          </button>
          <div class="or">HOẶC</div>
          <button class="deck blue disabled" id="fortuneDeck" onclick="chooseEventCard('Khí vận')">
            <span>KHÍ VẬN</span><span class="icon">🧰</span><small>Nhấn để chọn</small>
          </button>
        </div>

        <div class="bottom-box">
          <h3>LỊCH SỬ SỰ KIỆN</h3>
          <div class="log" id="log"></div>
        </div>
      </div>
    </section>

    <aside class="panel right-panel">
      <div class="turn-card">
        <h3 id="turn">LƯỢT CỦA BẠN</h3>
        <div class="dice-readout" id="dice">🎲 + 🎲</div>
      </div>

      <div class="actions">
        <button id="rollBtn" onclick="rollDice()" disabled>🎲 XÚC XẮC</button>
        <button id="buyBtn" onclick="buyProperty()" disabled>🛒 MUA ĐẤT</button>
        <button id="buildBtn" onclick="buildHouse()" disabled>🏠 XÂY NHÀ</button>
        <button id="cardBtn" onclick="openPendingDeck()" disabled>🃏 THẺ BÀI</button>
        <button id="endBtn" onclick="endTurn()" disabled>⏩ KẾT THÚC LƯỢT</button>
      </div>

      <div class="current-card">
        <h3>Ô HIỆN TẠI</h3>
        <div class="current-symbol" id="currentSymbol">—</div>
      </div>

      <div class="property-card" id="property">Chọn <b>Bắt đầu ván</b> để chơi.</div>
    </aside>
  </main>
</div>

<div class="modal" id="eventModal">
  <div class="event-popup">
    <div class="event-head chance" id="eventHead">CƠ HỘI</div>
    <div class="event-body">
      <div class="event-icon" id="eventIcon">❓</div>
      <h2 id="eventTitle">Bạn trúng thưởng!</h2>
      <p id="eventText">Nhận $200 từ ngân hàng.</p>
    </div>
    <button class="event-close" onclick="closeEventModal()">ĐÓNG</button>
  </div>
</div>

function money(n){return '$'+Math.round(n)}
function current(){return state?.players[state.current]}
function locByPos(pos){return LOCATIONS[pos%40]}
function addLog(msg,kind=''){const e=document.createElement('div');e.className='entry '+kind;e.textContent=msg;$('log').prepend(e)}

function updatePlayerSetup(){
  const ai=$('playMode').value==='human-ai';
  $('aiSetup').style.display=ai?'inline':'none';
  $('localSetup').style.display=ai?'none':'inline';
}

function startGame(){
  const aiMode=$('playMode').value==='human-ai';
  const n=aiMode?1+(+$('aiCount').value):+$('playerCount').value;
  state={mode:$('gameMode').value,round:1,current:0,rolled:false,pendingBuy:false,pendingCard:null,modalOpen:false,gameOver:false,properties:{},players:[]};
  for(let i=0;i<n;i++)state.players.push({
    name:aiMode?(i===0?'Bạn':['AI - Linh','AI - Minh','AI - An'][i-1]):'Người '+(i+1),
    cash:1500,pos:0,jail:0,bankrupt:false,color:PLAYER_COLORS[i],laps:0,ai:aiMode&&i>0
  });
  $('setup').style.display='none';$('log').innerHTML='';
  renderBoard();renderAll();addLog('🏙️ Ván Cờ Tỷ Phú Sài Gòn bắt đầu!');
  maybeAiTurn();
}

function boardIndexStyle(i){
  if(i<=10)return{row:11,col:11-i};
  if(i<=20)return{row:11-(i-10),col:1};
  if(i<=30)return{row:1,col:i-20+1};
  return{row:i-30+1,col:11};
}

function renderBoard(){
  const b=$('board');b.querySelectorAll('.tile').forEach(x=>x.remove());
  for(let i=0;i<40;i++){
    const loc=LOCATIONS[i],st=boardIndexStyle(i),d=document.createElement('div');
    const event=loc.type==='Cơ hội',chest=loc.type==='Khí vận';
    d.className='tile'+([0,10,20,30].includes(i)?' corner':'')+(event?' event':'')+(chest?' chest':'');
    d.style.gridRow=st.row;d.style.gridColumn=st.col;d.dataset.i=i;
    if(loc.setId)d.innerHTML+=`<div class="bar" style="background:${SET_COLORS[loc.setId]}"></div>`;
    d.innerHTML+=`<div class="name">${loc.name}</div>`;
    if(loc.cost)d.innerHTML+=`<div class="price">${money(loc.cost)}</div>`;
    d.innerHTML+=`<div class="houses"></div><div class="tokens"></div>`;
    b.appendChild(d);
  }
}

function renderAll(){
  if(!state)return;
  document.querySelectorAll('.tokens').forEach(x=>x.innerHTML='');
  document.querySelectorAll('.owner').forEach(x=>x.remove());
  document.querySelectorAll('.houses').forEach(x=>x.textContent='');

  state.players.forEach((p,idx)=>{
    if(p.bankrupt)return;
    const tile=document.querySelector(`.tile[data-i="${p.pos}"] .tokens`);
    if(tile)tile.innerHTML+=`<span class="chibi-token ${idx===state.current?'active':''}"><img src="../assets/monopoly/v2/chibi_${(idx%4)+1}.png"></span>`;
  });

  Object.entries(state.properties).forEach(([pos,pr])=>{
    const tile=document.querySelector(`.tile[data-i="${pos}"]`);if(!tile)return;
    const dot=document.createElement('i');dot.className='owner';dot.style.background=state.players[pr.owner].color;tile.appendChild(dot);
    if(pr.houses)tile.querySelector('.houses').textContent=pr.houses>=5?'🏨':'🏠'.repeat(pr.houses);
  });

  $('players').innerHTML=state.players.map((p,i)=>`
    <div class="player ${i===state.current?'active':''} ${p.bankrupt?'bankrupt':''}" style="--pc:${p.color}">
      <img class="player-avatar" src="../assets/monopoly/v2/chibi_${(i%4)+1}.png">
      <div><div class="player-name">${p.name} ${p.ai?'<span class="ai-badge">🤖 AI</span>':''}</div>
      <div class="player-money">${money(p.cash)}</div>
      <div class="player-meta">Tài sản: ${money(netWorth(p))} · Ô ${p.pos+1}${p.jail?' · 🔒':''}</div></div>
    </div>`).join('');

  const p=current(),loc=locByPos(p.pos);
  $('turn').textContent=state.gameOver?'VÁN ĐÃ KẾT THÚC':(p.ai?`LƯỢT ${p.name}`:'LƯỢT CỦA BẠN');
  $('gameInfo').innerHTML=`Vòng: <b>${state.round}</b>${state.mode==='turns'?' / 20':''}<br>Số người còn lại: ${state.players.filter(x=>!x.bankrupt).length}`;
  $('property').innerHTML=`<b>${loc.name}</b><br>Loại: ${loc.type}${loc.cost?`<br>Giá: ${money(loc.cost)}`:''}${loc.rent?`<br>Thuê gốc: ${money(loc.rent)}`:''}`;
  $('currentSymbol').textContent=loc.type==='Cơ hội'?'❓':loc.type==='Khí vận'?'🧰':loc.type==='Nhà giam'?'🔒':loc.type==='Thuế'?'💰':'🏢';

  const blocked=state.pendingCard||state.modalOpen;
  $('rollBtn').disabled=state.gameOver||state.rolled||p.bankrupt||p.ai||blocked;
  $('centerRoll').disabled=$('rollBtn').disabled;
  $('buyBtn').disabled=!state.pendingBuy||p.cash<loc.cost||p.ai||blocked;
  $('buildBtn').disabled=!canBuild(p,loc)||p.ai||blocked;
  $('cardBtn').disabled=!state.pendingCard||p.ai;
  $('endBtn').disabled=state.gameOver||!state.rolled||p.ai||blocked;

  updateDeckUI();
}

function updateDeckUI(){
  const pending=state?.pendingCard;
  $('chanceDeck').className='deck red '+(pending==='Cơ hội'?'enabled':'disabled');
  $('fortuneDeck').className='deck blue '+(pending==='Khí vận'?'enabled':'disabled');
}

function landingMessage(title,text){
  $('landingTitle').textContent=title;$('landingText').textContent=text;
}

async function rollDice(){
  if(!state||state.gameOver||state.rolled||state.pendingCard||state.modalOpen)return;
  const p=current();

  if(p.jail>0){
    const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
    $('dice').textContent=`🎲 ${a} + 🎲 ${b}`;
    $('centerDice').textContent=`${dieFace(a)} ${dieFace(b)}`;
    if(a===b){p.jail=0;addLog(`${p.name} tung đôi và ra khỏi nhà giam!`)}
    else{p.jail--;state.rolled=true;addLog(`${p.name} còn ${p.jail} lượt trong nhà giam.`);renderAll();return}
  }

  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),sum=d1+d2;
  $('dice').textContent=`🎲 ${d1} + 🎲 ${d2} = ${sum}`;$('centerDice').textContent=`${dieFace(d1)} ${dieFace(d2)}`;
  state.rolled=true;renderAll();

  for(let step=0;step<sum;step++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){p.cash+=200;p.laps++;addLog(`${p.name}: qua KHỞI HÀNH +$200`,'amount-plus')}
    renderAll();await sleep(190);
  }

  const loc=locByPos(p.pos);landingMessage(`Bạn đã dừng ở ${loc.name}`,loc.type==='Cơ hội'||loc.type==='Khí vận'?'Hãy nhấn vào bộ thẻ tương ứng để xem nội dung.':'Xử lý ô hiện tại.');
  resolveLanding();
}

function dieFace(n){return['','⚀','⚁','⚂','⚃','⚄','⚅'][n]}

function resolveLanding(){
  const p=current(),loc=locByPos(p.pos);state.pendingBuy=false;
  const owned=state.properties[p.pos];

  if(['Đất','Bến/Ga','Tiện ích'].includes(loc.type)){
    if(!owned){state.pendingBuy=true;addLog(`${loc.name} chưa có chủ · Giá ${money(loc.cost)}`)}
    else if(owned.owner!==state.current){
      const rent=calcRent(p.pos,owned);payTo(state.current,owned.owner,rent);
      addLog(`${p.name}: trả ${money(rent)} tiền thuê cho ${state.players[owned.owner].name}`,'amount-minus');
    }
  }else if(loc.type==='Thuế'){
    const amt=loc.rent||100;p.cash-=amt;addLog(`${p.name}: nộp thuế ${money(amt)}`,'amount-minus');
  }else if(loc.type==='Cơ hội'||loc.type==='Khí vận'){
    state.pendingCard=loc.type;
    landingMessage(`Bạn đã dừng ở ô ${loc.type.toUpperCase()}`,p.ai?'AI đang rút thẻ…':'Nhấn vào thẻ phía dưới để lật nội dung.');
  }else if(loc.type==='Nhà giam'){
    p.pos=10;p.jail=3;addLog(`${p.name}: vào Nhà giam`);
  }

  checkBankruptcy(p);checkWin();renderAll();

  if(p.ai&&state.pendingCard)setTimeout(()=>chooseEventCard(state.pendingCard,true),500);
}

function openPendingDeck(){
  if(state?.pendingCard)chooseEventCard(state.pendingCard,false);
}

function chooseEventCard(type,auto=false){
  if(!state||state.pendingCard!==type)return;
  const p=current(),deck=type==='Cơ hội'?CHANCE_CARDS:FORTUNE_CARDS;
  const card=deck[Math.floor(Math.random()*deck.length)];
  card.effect(p);state.pendingCard=null;

  addLog(`${type.toUpperCase()}: ${card.title} — ${card.text}`);
  checkBankruptcy(p);checkWin();

  if(auto){
    landingMessage(`${type}: ${card.title}`,card.text);
    renderAll();
    setTimeout(()=>{if(current()?.ai&&!state.gameOver)endTurn()},750);
    return;
  }

  state.modalOpen=true;
  $('eventHead').textContent=type.toUpperCase();
  $('eventHead').className='event-head '+(type==='Cơ hội'?'chance':'fortune');
  $('eventIcon').textContent=card.icon;$('eventTitle').textContent=card.title;$('eventText').textContent=card.text;
  $('eventModal').classList.add('show');renderAll();
}

function closeEventModal(){
  $('eventModal').classList.remove('show');
  if(!state)return;state.modalOpen=false;
  landingMessage('Đã xử lý thẻ','Bạn có thể mua đất, xây nhà hoặc kết thúc lượt.');
  renderAll();
}

function calcRent(pos,pr){
  const loc=LOCATIONS[pos];
  if(loc.type==='Đất'){
    if(pr.houses>=5)return loc.hotel||loc.rent*25;
    if(pr.houses>0)return loc.house[pr.houses-1]||loc.rent;
    if(ownsFullSet(pr.owner,loc.setId))return loc.rent*2;
  }
  if(loc.type==='Bến/Ga'){
    const count=Object.entries(state.properties).filter(([k,v])=>v.owner===pr.owner&&LOCATIONS[k].type==='Bến/Ga').length;
    return 25*Math.pow(2,Math.max(0,count-1));
  }
  if(loc.type==='Tiện ích')return 50;
  return loc.rent;
}

function buyProperty(){
  const p=current(),loc=locByPos(p.pos);
  if(!state.pendingBuy||p.cash<loc.cost)return;
  p.cash-=loc.cost;state.properties[p.pos]={owner:state.current,houses:0};state.pendingBuy=false;
  addLog(`${p.name}: mua ${loc.name} ${money(loc.cost)}`);renderAll();
}

function ownsFullSet(owner,setId){
  if(!setId)return false;
  const ids=LOCATIONS.map((x,i)=>x.setId===setId?i:null).filter(x=>x!==null);
  return ids.every(i=>state.properties[i]&&state.properties[i].owner===owner);
}

function canBuild(p,loc){
  if(!state||state.gameOver||!state.rolled||loc.type!=='Đất')return false;
  const pr=state.properties[p.pos];
  return !!(pr&&pr.owner===state.current&&ownsFullSet(state.current,loc.setId)&&pr.houses<5&&p.cash>=loc.buildCost);
}

function buildHouse(){
  const p=current(),loc=locByPos(p.pos),pr=state.properties[p.pos];if(!canBuild(p,loc))return;
  p.cash-=loc.buildCost;pr.houses++;addLog(`${p.name}: xây ${pr.houses===5?'khách sạn':'nhà'} tại ${loc.name}`);renderAll();
}

function aiPropertyScore(loc){
  let score=0;
  if(loc.type==='Đất'){
    score=loc.rent*8+loc.cost*.35;
    const set=LOCATIONS.map((x,i)=>x.setId===loc.setId?i:null).filter(x=>x!==null);
    const mine=set.filter(i=>state.properties[i]&&state.properties[i].owner===state.current).length;
    if(mine===set.length-1)score+=900;else if(mine>0)score+=180*mine;
  }else if(loc.type==='Bến/Ga')score=260;
  else if(loc.type==='Tiện ích')score=150;
  return score;
}
function aiShouldBuy(p,loc){
  if(!loc.cost||p.cash<loc.cost)return false;
  const reserve=Math.max(220,Math.min(500,loc.cost*.9)),score=aiPropertyScore(loc);
  return(p.cash-loc.cost>=reserve&&score>=loc.cost*.65)||score>700;
}
function aiBuildBest(){
  const p=current(),choices=[];
  Object.entries(state.properties).forEach(([k,pr])=>{
    const loc=LOCATIONS[+k];
    if(pr.owner!==state.current||loc.type!=='Đất'||!ownsFullSet(state.current,loc.setId)||pr.houses>=5||p.cash<loc.buildCost+250)return;
    const next=pr.houses>=4?loc.hotel:loc.house[pr.houses],old=pr.houses===0?loc.rent:loc.house[pr.houses-1];
    choices.push({pr,loc,gain:(next||0)-(old||0)});
  });
  choices.sort((a,b)=>(b.gain/b.loc.buildCost)-(a.gain/a.loc.buildCost));
  if(!choices.length)return false;
  const x=choices[0];p.cash-=x.loc.buildCost;x.pr.houses++;addLog(`🤖 ${p.name}: xây nhà tại ${x.loc.name}`);return true;
}

function maybeAiTurn(){
  if(!state||state.gameOver||!current().ai)return;renderAll();setTimeout(aiTakeTurn,650);
}
async function aiTakeTurn(){
  if(!state||state.gameOver||!current().ai)return;
  await rollDice();await sleep(450);
  if(state.pendingCard)return; // resolveLanding schedules card and end turn.
  if(!state||state.gameOver||!current().ai)return;
  const p=current(),loc=locByPos(p.pos);
  if(state.pendingBuy&&aiShouldBuy(p,loc))buyProperty();
  let builds=0;while(builds<2&&aiBuildBest()){builds++;await sleep(160)}
  renderAll();await sleep(500);endTurn();
}

function payTo(from,to,amt){const a=state.players[from],b=state.players[to];a.cash-=amt;b.cash+=amt;checkBankruptcy(a)}
function checkBankruptcy(p){
  if(p.cash>=-500||p.bankrupt)return;p.bankrupt=true;addLog(`💥 ${p.name} phá sản!`);
  const idx=state.players.indexOf(p);Object.keys(state.properties).forEach(k=>{if(state.properties[k].owner===idx)delete state.properties[k]});
}
function endTurn(){
  if(!state||state.gameOver||!state.rolled||state.pendingCard||state.modalOpen)return;
  state.rolled=false;state.pendingBuy=false;
  let next=state.current,loops=0;
  do{next=(next+1)%state.players.length;if(next===0)state.round++;loops++}while(state.players[next].bankrupt&&loops<=state.players.length);
  state.current=next;$('dice').textContent='🎲 + 🎲';$('centerDice').textContent='⚄ ⚀';
  landingMessage('🎲 Lượt mới','Đổ xúc xắc để tiếp tục.');checkWin();renderAll();maybeAiTurn();
}
function checkWin(){
  const active=state.players.filter(p=>!p.bankrupt);
  if(state.mode==='endless'&&active.length===1)finish(`${active[0].name} chiến thắng!`);
  if(state.mode==='turns'&&state.round>20){const w=[...active].sort((a,b)=>netWorth(b)-netWorth(a))[0];finish(`${w.name} thắng với ${money(netWorth(w))}`)}
  if(state.mode==='networth'){const w=active.find(p=>netWorth(p)>=5000);if(w)finish(`${w.name} đạt $5000 và chiến thắng!`)}
}
function netWorth(p){
  if(!state)return p?.cash||0;
  let v=p.cash,idx=state.players.indexOf(p);
  Object.entries(state.properties).forEach(([k,pr])=>{if(pr.owner===idx){const l=LOCATIONS[k];v+=l.cost+(pr.houses||0)*l.buildCost}});
  return v;
}
function finish(msg){state.gameOver=true;addLog('🏆 '+msg);$('turn').textContent='🏆 '+msg;renderAll()}

renderBoard();
landingMessage('🎲 Sẵn sàng','Chọn chế độ và bắt đầu ván.');
</script>
