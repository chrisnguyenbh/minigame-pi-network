<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cờ Caro</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="assets/pi.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#26365c,#101426 65%);color:#fff;padding:20px 12px}
.app{width:min(760px,100%);margin:auto;text-align:center}
h1{margin:0 0 6px;font-size:30px}.sub{opacity:.72;margin-bottom:14px}
.panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;margin-bottom:12px}
.modes,.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:14px;cursor:pointer;background:#e9edf8;color:#18203a}
button.active{background:#25b879;color:#fff}button.new{background:#ef5261;color:#fff}
.status{font-weight:850;font-size:17px;margin-top:11px;min-height:24px}
.board-wrap{overflow:auto;max-width:100%;border-radius:10px;padding:12px;background:#f8f5e9;box-shadow:0 14px 35px rgba(0,0,0,.3);-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:repeat(19,38px);grid-template-rows:repeat(19,38px);gap:0;width:max-content;margin:auto;background:#fffef7;border-top:1px solid #91a8c2;border-left:1px solid #91a8c2}
.cell{width:38px;height:38px;background:#fffef7;border-right:1px solid #91a8c2;border-bottom:1px solid #91a8c2;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;cursor:pointer;user-select:none}
.cell:hover{background:#eef5ff}.cell.x{color:#c82732;text-shadow:0 1px #fff}.cell.o{color:#163d8c;text-shadow:0 1px #fff}.cell.last{background:#fff2b8;box-shadow:inset 0 0 0 2px rgba(196,139,25,.45)}
.legend{font-size:12px;opacity:.72;margin-top:9px}
@media(max-width:560px){body{padding:12px 7px}.board{grid-template-columns:repeat(19,32px);grid-template-rows:repeat(19,32px)}.cell{width:32px;height:32px;font-size:22px}}
</style>
</head>
<body>
<div class="app">
<h1>⭕ CỜ CARO ❌</h1>
<div class="sub">5 quân liên tiếp để chiến thắng</div>
<div class="panel">
  <div class="modes">
    <button id="pvpBtn" onclick="setMode('pvp')">👥 Người vs Người</button>
    <button id="aiBtn" class="active" onclick="setMode('ai')">👤 Người vs 🤖 Máy</button>
  </div>
  <div class="modes" style="margin-top:9px">
    <button id="smallBtn" onclick="setBoardSize(3)">3×3</button>
    <button id="largeBtn" class="active" onclick="setBoardSize(19)">19×19</button>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="panel actions"><button class="new" onclick="resetGame()">↻ Ván mới</button></div>
<div class="legend">Bạn đánh X khi chơi với máy. Máy đánh O.</div>
</div>
<script>
let N=19;
let WIN=5;
let board,currentPlayer,gameOver,mode='ai',aiThinking=false,lastMove=null;
const boardEl=document.getElementById('board'), statusEl=document.getElementById('status');

function emptyBoard(){return Array.from({length:N},()=>Array(N).fill(null))}
function setMode(m){
  mode=m;
  document.getElementById('pvpBtn').classList.toggle('active',m==='pvp');
  document.getElementById('aiBtn').classList.toggle('active',m==='ai');
  resetGame();
}
function setBoardSize(size){
  N=size;
  WIN=size===3?3:5;
  document.getElementById('smallBtn').classList.toggle('active',size===3);
  document.getElementById('largeBtn').classList.toggle('active',size===19);
  resetGame();
}
function resetGame(){
  board=emptyBoard();currentPlayer='X';gameOver=false;aiThinking=false;lastMove=null;
  document.querySelector('.sub').textContent=N===3?'3 quân liên tiếp để chiến thắng':'5 quân liên tiếp để chiến thắng';
  document.querySelector('.legend').textContent=N===3?'Chế độ 3×3: AI chơi tối ưu. Bạn đánh X, máy đánh O.':'Chế độ 19×19: 5 quân liên tiếp. Bạn đánh X, máy đánh O.';
  render();updateStatus();
}
function render(){
  boardEl.innerHTML='';
  const cellSize=N===3?88:(window.innerWidth<=560?32:38);
  boardEl.style.gridTemplateColumns=`repeat(${N},${cellSize}px)`;
  boardEl.style.gridTemplateRows=`repeat(${N},${cellSize}px)`;
  boardEl.style.fontSize=N===3?'42px':'25px';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='cell';d.style.width=cellSize+'px';d.style.height=cellSize+'px';d.style.fontSize=(N===3?48:(window.innerWidth<=560?22:25))+'px';
    if(board[r][c]){d.textContent=board[r][c];d.classList.add(board[r][c].toLowerCase())}
    if(lastMove&&lastMove.r===r&&lastMove.c===c)d.classList.add('last');
    d.onclick=()=>humanClick(r,c);boardEl.appendChild(d);
  }
}
function updateStatus(msg){
  if(msg){statusEl.textContent=msg;return}
  if(gameOver)return;
  if(aiThinking){statusEl.textContent='🤖 Máy đang suy nghĩ…';return}
  if(mode==='ai') statusEl.textContent=currentPlayer==='X'?'Lượt bạn — X':'Lượt máy — O';
  else statusEl.textContent=`Lượt người chơi ${currentPlayer}`;
}
function humanClick(r,c){
  if(gameOver||aiThinking||board[r][c])return;
  if(mode==='ai'&&currentPlayer!=='X')return;
  play(r,c,currentPlayer);
}
function play(r,c,p){
  board[r][c]=p;lastMove={r,c};render();
  if(checkWin(r,c,p)){
    gameOver=true;
    updateStatus(mode==='ai'?(p==='X'?'🏆 Bạn thắng!':'🤖 Máy thắng!'):`🏆 Người chơi ${p} thắng!`);
    return;
  }
  if(board.every(row=>row.every(Boolean))){gameOver=true;updateStatus('🤝 Hòa cờ!');return}
  currentPlayer=p==='X'?'O':'X';updateStatus();
  if(mode==='ai'&&currentPlayer==='O'){aiThinking=true;updateStatus();setTimeout(aiMove,180)}
}
function countDir(r,c,dr,dc,p){
  let n=0;r+=dr;c+=dc;
  while(r>=0&&r<N&&c>=0&&c<N&&board[r][c]===p){n++;r+=dr;c+=dc}
  return n;
}
function checkWin(r,c,p){
  return [[1,0],[0,1],[1,1],[1,-1]].some(([dr,dc])=>1+countDir(r,c,dr,dc,p)+countDir(r,c,-dr,-dc,p)>=WIN)
}
function lineScore(r,c,p){
  let score=0;
  for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){
    let a=countDir(r,c,dr,dc,p),b=countDir(r,c,-dr,-dc,p),n=1+a+b;
    let r1=r+(a+1)*dr,c1=c+(a+1)*dc,r2=r-(b+1)*dr,c2=c-(b+1)*dc;
    let open=(r1>=0&&r1<N&&c1>=0&&c1<N&&!board[r1][c1]?1:0)+(r2>=0&&r2<N&&c2>=0&&c2<N&&!board[r2][c2]?1:0);
    if(n>=WIN)score+=1000000;else if(n===4&&open===2)score+=80000;else if(n===4)score+=15000;
    else if(n===3&&open===2)score+=6000;else if(n===3)score+=800;else if(n===2&&open===2)score+=250;else score+=n*8;
  } return score;
}
function candidateCells(){
  if(N===3){
    const out=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!board[r][c])out.push({r,c});
    return out;
  }
  const out=[];let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]){
    any=true;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      let rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<N&&cc>=0&&cc<N&&!board[rr][cc])out.push(rr*N+cc);
    }
  }
  if(!any){
    const mid=Math.floor(N/2);
    return [{r:mid,c:mid}];
  }
  return [...new Set(out)].map(v=>({r:Math.floor(v/N),c:v%N}));
}
function immediateWinningMove(player){
  for(const m of candidateCells()){
    board[m.r][m.c]=player;
    const win=checkWin(m.r,m.c,player);
    board[m.r][m.c]=null;
    if(win)return m;
  }
  return null;
}

function positionScore(m,player){
  const other=player==='O'?'X':'O';
  board[m.r][m.c]=player;
  const own=lineScore(m.r,m.c,player);
  board[m.r][m.c]=null;

  board[m.r][m.c]=other;
  const opp=lineScore(m.r,m.c,other);
  board[m.r][m.c]=null;

  const center=(N-1)/2;
  const central=30-(Math.abs(m.r-center)+Math.abs(m.c-center));
  return own*1.18+opp*1.32+central;
}

function topCandidates(limit=12){
  return candidateCells()
    .map(m=>({m,score:positionScore(m,'O')}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,limit)
    .map(x=>x.m);
}

function evaluateBoardForAI(){
  let bestO=0,bestX=0;
  const cand=candidateCells();
  for(const m of cand){
    board[m.r][m.c]='O';bestO=Math.max(bestO,lineScore(m.r,m.c,'O'));board[m.r][m.c]=null;
    board[m.r][m.c]='X';bestX=Math.max(bestX,lineScore(m.r,m.c,'X'));board[m.r][m.c]=null;
  }
  return bestO-bestX*1.18;
}


function terminal3(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]){
    if(checkWin(r,c,board[r][c]))return board[r][c];
  }
  return board.every(row=>row.every(Boolean))?'D':null;
}
function minimax3(isMax,depth){
  const end=terminal3();
  if(end==='O')return 10-depth;
  if(end==='X')return depth-10;
  if(end==='D')return 0;
  let best=isMax?-Infinity:Infinity;
  const p=isMax?'O':'X';
  for(const m of candidateCells()){
    board[m.r][m.c]=p;
    const v=minimax3(!isMax,depth+1);
    board[m.r][m.c]=null;
    best=isMax?Math.max(best,v):Math.min(best,v);
  }
  return best;
}
function best3x3Move(){
  let best=null,bestScore=-Infinity;
  for(const m of candidateCells()){
    board[m.r][m.c]='O';
    const score=minimax3(false,0);
    board[m.r][m.c]=null;
    if(score>bestScore){bestScore=score;best=m;}
  }
  return best;
}
function aiMove(){
  if(gameOver||mode!=='ai'){aiThinking=false;return}

  if(N===3){
    const m=best3x3Move();
    aiThinking=false;
    if(m)play(m.r,m.c,'O');
    return;
  }

  // 1. Có thể thắng ngay -> thắng.
  let best=immediateWinningMove('O');

  // 2. Người sắp thắng -> bắt buộc chặn.
  if(!best)best=immediateWinningMove('X');

  // 3. Nếu chưa có nước bắt buộc, tìm 2 ply:
  //    thử nước của AI rồi giả định người chơi đáp trả mạnh nhất.
  if(!best){
    let bestValue=-Infinity;
    const aiCandidates=topCandidates(14);

    for(const m of aiCandidates){
      board[m.r][m.c]='O';

      // Thưởng rất lớn cho thế tạo nhiều đe dọa.
      let value=lineScore(m.r,m.c,'O')*1.25;

      let worstReply=Infinity;
      const replies=candidateCells()
        .map(x=>({m:x,score:positionScore(x,'X')}))
        .sort((a,b)=>b.score-a.score)
        .slice(0,10)
        .map(x=>x.m);

      if(!replies.length){
        worstReply=evaluateBoardForAI();
      }else{
        for(const r of replies){
          board[r.r][r.c]='X';

          if(checkWin(r.r,r.c,'X')){
            worstReply=Math.min(worstReply,-10000000);
          }else{
            // AI nhìn thêm nước chiến thuật kế tiếp.
            const nextWin=immediateWinningMove('O');
            let v=nextWin?5000000:evaluateBoardForAI();
            worstReply=Math.min(worstReply,v);
          }

          board[r.r][r.c]=null;
        }
      }

      board[m.r][m.c]=null;
      value+=worstReply;

      if(value>bestValue){
        bestValue=value;
        best=m;
      }
    }
  }

  aiThinking=false;
  if(best)play(best.r,best.c,'O');
}
resetGame();
document.addEventListener('DOMContentLoaded',()=>{if(window.MiniPi)window.MiniPi.init().catch(()=>{})});
</script>
</body>
</html>
