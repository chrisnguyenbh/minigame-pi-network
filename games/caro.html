<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cờ Caro</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="assets/pi.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#26365c,#101426 65%);color:#fff;padding:20px 12px}
.app{width:min(760px,100%);margin:auto;text-align:center}
h1{margin:0 0 6px;font-size:30px}.sub{opacity:.72;margin-bottom:14px}
.panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;margin-bottom:12px}
.modes,.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:14px;cursor:pointer;background:#e9edf8;color:#18203a}
button.active{background:#25b879;color:#fff}button.new{background:#ef5261;color:#fff}
.status{font-weight:850;font-size:17px;margin-top:11px;min-height:24px}
.board-wrap{overflow:auto;max-width:100%;border-radius:10px;padding:12px;background:#f8f5e9;box-shadow:0 14px 35px rgba(0,0,0,.3);-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:repeat(19,38px);grid-template-rows:repeat(19,38px);gap:0;width:max-content;margin:auto;background:#fffef7;border-top:1px solid #91a8c2;border-left:1px solid #91a8c2}
.cell{width:38px;height:38px;background:#fffef7;border-right:1px solid #91a8c2;border-bottom:1px solid #91a8c2;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;cursor:pointer;user-select:none}
.cell:hover{background:#eef5ff}.cell.x{color:#c82732;text-shadow:0 1px #fff}.cell.o{color:#163d8c;text-shadow:0 1px #fff}.cell.last{background:#fff2b8;box-shadow:inset 0 0 0 2px rgba(196,139,25,.45)}
.legend{font-size:12px;opacity:.72;margin-top:9px}.ai-info{font-size:12px;opacity:.78;margin-top:8px;min-height:18px}
@media(max-width:560px){body{padding:12px 7px}.board{grid-template-columns:repeat(19,32px);grid-template-rows:repeat(19,32px)}.cell{width:32px;height:32px;font-size:22px}}
</style>
</head>
<body>
<div class="app">
<h1>⭕ CỜ CARO ❌</h1>
<div class="sub">5 quân liên tiếp để chiến thắng</div>
<div class="panel">
  <div class="modes">
    <button id="pvpBtn" onclick="setMode('pvp')">👥 Người vs Người</button>
    <button id="aiBtn" class="active" onclick="setMode('ai')">👤 Người vs 🤖 Máy</button>
  </div>
  <div class="modes" style="margin-top:9px">
    <button id="smallBtn" onclick="setBoardSize(3)">3×3</button>
    <button id="largeBtn" class="active" onclick="setBoardSize(19)">19×19</button>
  </div>
  <div class="status" id="status"></div>
  <div class="ai-info" id="aiInfo">🤖 AI Mạnh Nhất: ưu tiên thắng/chặn bắt buộc, nhận diện thế ép, song 3, song 4 và phản công chủ động.</div>
</div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="panel actions"><button class="new" onclick="resetGame()">↻ Ván mới</button></div>
<div class="legend">Bạn đánh X khi chơi với máy. Máy đánh O.</div>
</div>
<script>
let N=19;
let WIN=5;
let board,currentPlayer,gameOver,mode='ai',aiThinking=false,lastMove=null;
const AI_CFG={depth:12,time:9500,width:18};
const boardEl=document.getElementById('board'), statusEl=document.getElementById('status');

function emptyBoard(){return Array.from({length:N},()=>Array(N).fill(null))}
function setMode(m){
  mode=m;
  document.getElementById('pvpBtn').classList.toggle('active',m==='pvp');
  document.getElementById('aiBtn').classList.toggle('active',m==='ai');
  resetGame();
}
function setBoardSize(size){
  N=size;
  WIN=size===3?3:5;
  document.getElementById('smallBtn').classList.toggle('active',size===3);
  document.getElementById('largeBtn').classList.toggle('active',size===19);
  resetGame();
}
function updateAiInfo(){
  const el=document.getElementById('aiInfo');
  if(!el)return;
  el.textContent = N===3
    ? '3×3: AI Minimax tối ưu.'
    : '🤖 AI Tournament V3: kiểm tra fork chính xác, tìm thắng cưỡng bức và Alpha-Beta sâu.';
}
function resetGame(){
  board=emptyBoard();currentPlayer='X';gameOver=false;aiThinking=false;lastMove=null;
  document.querySelector('.sub').textContent=N===3?'3 quân liên tiếp để chiến thắng':'5 quân liên tiếp để chiến thắng';
  document.querySelector('.legend').textContent=N===3?'Chế độ 3×3: AI chơi tối ưu. Bạn đánh X, máy đánh O.':'Chế độ 19×19: 5 quân liên tiếp. Bạn đánh X, máy đánh O.';
  render();updateStatus();updateAiInfo();
}
function render(){
  boardEl.innerHTML='';
  const cellSize=N===3?88:(window.innerWidth<=560?32:38);
  boardEl.style.gridTemplateColumns=`repeat(${N},${cellSize}px)`;
  boardEl.style.gridTemplateRows=`repeat(${N},${cellSize}px)`;
  boardEl.style.fontSize=N===3?'42px':'25px';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='cell';d.style.width=cellSize+'px';d.style.height=cellSize+'px';d.style.fontSize=(N===3?48:(window.innerWidth<=560?22:25))+'px';
    if(board[r][c]){d.textContent=board[r][c];d.classList.add(board[r][c].toLowerCase())}
    if(lastMove&&lastMove.r===r&&lastMove.c===c)d.classList.add('last');
    d.onclick=()=>humanClick(r,c);boardEl.appendChild(d);
  }
}
function updateStatus(msg){
  if(msg){statusEl.textContent=msg;return}
  if(gameOver)return;
  if(aiThinking){statusEl.textContent='🤖 Máy đang suy nghĩ…';return}
  if(mode==='ai') statusEl.textContent=currentPlayer==='X'?'Lượt bạn — X':'Lượt máy — O';
  else statusEl.textContent=`Lượt người chơi ${currentPlayer}`;
}
function humanClick(r,c){
  if(gameOver||aiThinking||board[r][c])return;
  if(mode==='ai'&&currentPlayer!=='X')return;
  play(r,c,currentPlayer);
}
function play(r,c,p){
  board[r][c]=p;lastMove={r,c};render();
  if(checkWin(r,c,p)){
    gameOver=true;
    updateStatus(mode==='ai'?(p==='X'?'🏆 Bạn thắng!':'🤖 Máy thắng!'):`🏆 Người chơi ${p} thắng!`);
    return;
  }
  if(board.every(row=>row.every(Boolean))){gameOver=true;updateStatus('🤝 Hòa cờ!');return}
  currentPlayer=p==='X'?'O':'X';updateStatus();
  if(mode==='ai'&&currentPlayer==='O'){aiThinking=true;updateStatus();setTimeout(aiMove,180)}
}
function countDir(r,c,dr,dc,p){
  let n=0;r+=dr;c+=dc;
  while(r>=0&&r<N&&c>=0&&c<N&&board[r][c]===p){n++;r+=dr;c+=dc}
  return n;
}
function checkWin(r,c,p){
  return [[1,0],[0,1],[1,1],[1,-1]].some(([dr,dc])=>1+countDir(r,c,dr,dc,p)+countDir(r,c,-dr,-dc,p)>=WIN)
}
function lineScore(r,c,p){
  let score=0;
  for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){
    let a=countDir(r,c,dr,dc,p),b=countDir(r,c,-dr,-dc,p),n=1+a+b;
    let r1=r+(a+1)*dr,c1=c+(a+1)*dc,r2=r-(b+1)*dr,c2=c-(b+1)*dc;
    let open=(r1>=0&&r1<N&&c1>=0&&c1<N&&!board[r1][c1]?1:0)+(r2>=0&&r2<N&&c2>=0&&c2<N&&!board[r2][c2]?1:0);
    if(n>=WIN)score+=1000000;else if(n===4&&open===2)score+=80000;else if(n===4)score+=15000;
    else if(n===3&&open===2)score+=6000;else if(n===3)score+=800;else if(n===2&&open===2)score+=250;else score+=n*8;
  } return score;
}
function candidateCells(){
  if(N===3){
    const out=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!board[r][c])out.push({r,c});
    return out;
  }
  const out=[];let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]){
    any=true;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      let rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<N&&cc>=0&&cc<N&&!board[rr][cc])out.push(rr*N+cc);
    }
  }
  if(!any){
    const mid=Math.floor(N/2);
    return [{r:mid,c:mid}];
  }
  return [...new Set(out)].map(v=>({r:Math.floor(v/N),c:v%N}));
}
function immediateWinningMove(player){
  for(const m of candidateCells()){
    board[m.r][m.c]=player;
    const win=checkWin(m.r,m.c,player);
    board[m.r][m.c]=null;
    if(win)return m;
  }
  return null;
}

function dirInfo(r,c,dr,dc,p){
  let a=0,b=0;
  let rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===p){a++;rr+=dr;cc+=dc}
  const open1=rr>=0&&rr<N&&cc>=0&&cc<N&&!board[rr][cc];
  rr=r-dr;cc=c-dc;
  while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===p){b++;rr-=dr;cc-=dc}
  const open2=rr>=0&&rr<N&&cc>=0&&cc<N&&!board[rr][cc];
  return {len:1+a+b,open:(open1?1:0)+(open2?1:0)};
}

function classifyMove(r,c,p){
  // board[r][c] is assumed already set to p
  let open4=0,four=0,open3=0,three=0,two=0;
  for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){
    const x=dirInfo(r,c,dr,dc,p);
    if(x.len>=5)return {win:true,open4:9,four:9,open3:9,score:1e12};
    if(x.len===4&&x.open===2)open4++;
    else if(x.len===4&&x.open===1)four++;
    else if(x.len===3&&x.open===2)open3++;
    else if(x.len===3&&x.open===1)three++;
    else if(x.len===2&&x.open===2)two++;
  }
  let score =
    open4*2.0e9 +
    four*2.5e8 +
    open3*1.5e7 +
    three*7.0e5 +
    two*2.5e4;
  // Compound threats are the heart of strong Gomoku.
  if(open4>=1&&four>=1)score+=4e9;
  if(four>=2)score+=3.5e9;
  if(open3>=2)score+=8e8;        // double-three
  if(open3>=1&&four>=1)score+=1.6e9; // three-four
  return {win:false,open4,four,open3,three,two,score};
}


function inBoard(r,c){return r>=0&&r<N&&c>=0&&c<N}

function linePattern(r,c,dr,dc,p,radius=5){
  let s='';
  for(let k=-radius;k<=radius;k++){
    const rr=r+k*dr,cc=c+k*dc;
    if(!inBoard(rr,cc)){s+='B';continue}
    const v=board[rr][cc];
    s+=v===p?'P':v? 'E':'_';
  }
  return s;
}

function patternThreatScore(r,c,p){
  // board[r][c] is assumed already set to p.
  // Detects broken as well as contiguous Gomoku threats around the move.
  let score=0;
  let fourThreats=0, threeThreats=0;

  const patterns4 = [
    "_PPPP_", "_PPP_P_", "_PP_PP_", "_P_PPP_",
    "EPPPP_", "_PPPPE", "BPPPP_", "_PPPPB"
  ];
  const patterns3 = [
    "__PPP__", "_PPP___", "___PPP_",
    "_PP_P__", "__P_PP_", "_P_PP__", "__PP_P_",
    "_P_P_P_"
  ];

  for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){
    const s=linePattern(r,c,dr,dc,p,5);

    if(s.includes("PPPPP")) return {score:1e13,fours:9,threes:9,win:true};

    let local4=0,local3=0;
    for(const pat of patterns4) if(s.includes(pat)) local4++;
    for(const pat of patterns3) if(s.includes(pat)) local3++;

    // Sliding 5-cell windows: one empty + four stones is a direct winning threat.
    for(let i=0;i<=s.length-5;i++){
      const w=s.slice(i,i+5);
      if(w.includes('E')||w.includes('B'))continue;
      const pc=[...w].filter(x=>x==='P').length;
      const ec=[...w].filter(x=>x==='_').length;
      if(pc===4&&ec===1)local4+=2;
      else if(pc===3&&ec===2)local3+=0.4;
    }

    if(local4){
      fourThreats+=local4;
      score+=local4*4.0e8;
    }
    if(local3){
      threeThreats+=local3;
      score+=local3*1.2e7;
    }
  }

  if(fourThreats>=2)score+=5.0e9;              // double four / two winning points
  if(fourThreats>=1&&threeThreats>=1)score+=2.5e9; // 4 + 3
  if(threeThreats>=2)score+=9.0e8;             // double three
  return {score,fours:fourThreats,threes:threeThreats,win:false};
}

function fullTacticalScore(m,p){
  board[m.r][m.c]=p;
  const base=classifyMove(m.r,m.c,p);
  const pat=patternThreatScore(m.r,m.c,p);
  board[m.r][m.c]=null;
  return {
    ...base,
    patternScore:pat.score,
    patternFours:pat.fours,
    patternThrees:pat.threes,
    score:Math.max(base.score,pat.score)+Math.min(base.score,pat.score)*0.18,
    win:base.win||pat.win
  };
}

function tacticalScore(m,p){
  return fullTacticalScore(m,p);
}

function moveScore(m,p){
  const q=p==='O'?'X':'O';
  const a=tacticalScore(m,p), d=tacticalScore(m,q);
  const mid=(N-1)/2;
  const center=120-(Math.abs(m.r-mid)+Math.abs(m.c-mid))*5;

  // Strong AI is slightly defense-biased unless it has a forcing attack.
  let attack=a.score*1.48;
  let defense=d.score*1.62;

  if(a.win)attack+=1e14;
  if(d.win)defense+=9e13;
  if(a.patternFours>=2||a.open4>=1)attack+=7e9;
  if(d.patternFours>=2||d.open4>=1)defense+=8e9;
  if(d.patternThrees>=2||d.open3>=2)defense+=1.4e9;

  return attack+defense+center;
}

function orderedMoves(player,limit){
  return candidateCells()
    .map(m=>({m,v:moveScore(m,player)}))
    .sort((a,b)=>b.v-a.v)
    .slice(0,limit)
    .map(x=>x.m);
}


function urgentThreatMoves(player){
  const out=[];
  for(const m of candidateCells()){
    const c=tacticalScore(m,player);
    let sev=0;
    if(c.win)sev=10;
    else if(c.open4||c.patternFours>=2)sev=9;
    else if(c.four>=2)sev=8.5;
    else if((c.four&&c.open3)||(c.patternFours>=1&&c.patternThrees>=1))sev=8;
    else if(c.open3>=2||c.patternThrees>=2)sev=7;
    else if(c.four||c.patternFours>=1)sev=6;
    else if(c.open3||c.patternThrees>=1)sev=4;
    if(sev)out.push({m,c,sev,v:moveScore(m,player)});
  }
  return out.sort((a,b)=>b.sev-a.sev||b.v-a.v);
}

function bestMandatoryDefense(){
  const threats=urgentThreatMoves('X');
  if(!threats.length)return null;

  // If X has a direct win or a forcing double threat, block the strongest square immediately.
  if(threats[0].sev>=7)return threats[0].m;

  // For lesser threats, compare with O's strongest forcing attack.
  const my=urgentThreatMoves('O');
  if(my.length&&my[0].sev>threats[0].sev)return my[0].m;
  return threats[0].sev>=6?threats[0].m:null;
}

function winningThreatMoves(player){
  const result=[];
  for(const m of candidateCells()){
    const c=fullTacticalScore(m,player);
    if(c.win||c.open4||c.four>=2||(c.four&&c.open3)||c.open3>=2||c.patternFours>=1||c.patternThrees>=2) result.push({m,c});
  }
  return result.sort((a,b)=>b.c.score-a.c.score);
}

function forcingMoves(player,limit=10){
  const out=[];
  for(const m of candidateCells()){
    const c=fullTacticalScore(m,player);
    if(c.win||c.open4||c.four||c.open3>=2||(c.open3&&c.three)||c.patternFours>=1||c.patternThrees>=2) out.push({m,c});
  }
  return out.sort((a,b)=>b.c.score-a.c.score).slice(0,limit).map(x=>x.m);
}

function threatSeverity(c){
  if(c.win)return 100;
  if(c.open4||c.patternFours>=2)return 90;
  if(c.four>=2)return 86;
  if((c.four&&c.open3)||(c.patternFours>=1&&c.patternThrees>=1))return 82;
  if(c.open3>=2||c.patternThrees>=2)return 76;
  if(c.four||c.patternFours>=1)return 68;
  if(c.open3||c.patternThrees>=1)return 46;
  if(c.three)return 24;
  return 0;
}

function opponentDangerAfter(move){
  board[move.r][move.c]='O';
  const direct=immediateWinningMove('X');
  if(direct){board[move.r][move.c]=null;return 1e18;}

  let maxSev=0, severeCount=0, sum=0;
  for(const m of candidateCells()){
    const c=fullTacticalScore(m,'X');
    const sev=threatSeverity(c);
    if(sev>maxSev)maxSev=sev;
    if(sev>=68)severeCount++;
    if(sev)sum+=sev*sev;
  }
  board[move.r][move.c]=null;
  // Multiple simultaneous threats are much more dangerous than one isolated threat.
  return maxSev*1e9 + severeCount*2e8 + sum*1e5;
}

function safestDefensiveMove(){
  const opp=urgentThreatMoves('X');
  if(!opp.length||opp[0].sev<4)return null;

  const candidates=new Map();
  for(const t of opp.slice(0,12))candidates.set(t.m.r*N+t.m.c,t.m);
  for(const m of orderedMoves('O',12))candidates.set(m.r*N+m.c,m);

  let best=null,bestDanger=Infinity,bestOwn=-Infinity;
  for(const m of candidates.values()){
    if(board[m.r][m.c])continue;
    const danger=opponentDangerAfter(m);
    const own=moveScore(m,'O');
    if(danger<bestDanger||(danger===bestDanger&&own>bestOwn)){
      best=m;bestDanger=danger;bestOwn=own;
    }
  }
  return best;
}

function hasImmediateWin(player){
  return immediateWinningMove(player)!==null;
}


// Exact tactical verifier. Instead of trusting pattern scores only, it asks a
// concrete question: after this move, how many distinct winning squares exist
// for the same player on the next turn? Two or more is a real fork.
function exactAfterMoveProfile(m,player){
  if(board[m.r][m.c])return {win:false,wins:[],fork:false,forcing:false};
  board[m.r][m.c]=player;
  const win=checkWin(m.r,m.c,player);
  let wins=[];
  if(!win)wins=immediateWinningMoves(player);
  board[m.r][m.c]=null;
  return {win,wins,fork:wins.length>=2,forcing:wins.length>=1};
}

function exactForkMoves(player,scanLimit=26){
  // Heuristic ordering is only used to choose what to verify first; whether a
  // move is a fork is decided by exact board simulation.
  const pool=orderedMoves(player,Math.min(scanLimit,candidateCells().length));
  const out=[];
  for(const m of pool){
    const x=exactAfterMoveProfile(m,player);
    if(x.win||x.fork||x.forcing){
      out.push({m,x,score:(x.win?1e16:0)+(x.fork?5e14:0)+x.wins.length*1e13+moveScore(m,player)});
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}

// Evaluate a defensive move by exact tactical consequences, not cosmetic
// positional score. This makes the engine very reluctant to leave a fork.
function exactDangerAfterDefense(m){
  if(board[m.r][m.c])return Infinity;
  board[m.r][m.c]='O';
  const direct=immediateWinningMoves('X');
  if(direct.length){board[m.r][m.c]=null;return 9e18+direct.length*1e17;}

  let forkCount=0, forceCount=0, bestHeuristic=0;
  const pool=orderedMoves('X',22);
  for(const x of pool){
    const prof=exactAfterMoveProfile(x,'X');
    if(prof.fork)forkCount++;
    else if(prof.forcing)forceCount++;
    const h=moveScore(x,'X');
    if(h>bestHeuristic)bestHeuristic=h;
  }
  board[m.r][m.c]=null;
  return forkCount*2e17+forceCount*2e15+bestHeuristic;
}

function strongestExactDefense(){
  const direct=immediateWinningMoves('X');
  if(direct.length===1)return direct[0];
  if(direct.length>1)return direct[0]; // already tactically lost; prolong best line.

  const oppForks=exactForkMoves('X',30).filter(t=>t.x.fork);
  if(!oppForks.length)return null;

  const map=new Map();
  for(const t of oppForks.slice(0,10))map.set(t.m.r*N+t.m.c,t.m);
  for(const m of orderedMoves('O',14))map.set(m.r*N+m.c,m);

  let best=null,bestDanger=Infinity,bestOwn=-Infinity;
  for(const m of map.values()){
    const danger=exactDangerAfterDefense(m);
    const own=moveScore(m,'O');
    if(danger<bestDanger || (danger===bestDanger&&own>bestOwn)){
      best=m;bestDanger=danger;bestOwn=own;
    }
  }
  return best;
}

function exactForcingMoves(player,limit=10){
  const opp=player==='O'?'X':'O';
  const wins=immediateWinningMoves(player);
  if(wins.length)return wins;
  const blocks=immediateWinningMoves(opp);
  if(blocks.length)return blocks;

  const exact=exactForkMoves(player,Math.max(18,limit*2));
  const seen=new Set(),out=[];
  for(const t of exact){
    if(!(t.x.fork||t.x.forcing))continue;
    const k=t.m.r*N+t.m.c;
    if(!seen.has(k)){seen.add(k);out.push(t.m)}
    if(out.length>=limit)return out;
  }
  for(const m of forcingMoves(player,limit)){
    const k=m.r*N+m.c;
    if(!seen.has(k)){seen.add(k);out.push(m)}
    if(out.length>=limit)break;
  }
  return out;
}

// Threat-space search: asks whether attacker can force a win through forcing moves.
// Defender is allowed to choose the strongest defensive replies.
function threatSearch(attacker,depth,deadline){
  if(Date.now()>deadline)return null;
  const defender=attacker==='O'?'X':'O';

  const iw=immediateWinningMove(attacker);
  if(iw)return {win:true,move:iw};
  if(depth<=0)return {win:false,move:null};

  const threats=exactForcingMoves(attacker,9);
  for(const m of threats){
    if(Date.now()>deadline)break;
    board[m.r][m.c]=attacker;
    if(checkWin(m.r,m.c,attacker)){board[m.r][m.c]=null;return {win:true,move:m}}

    // Defender first gets direct win; then must address attacker's immediate threats.
    const defWin=immediateWinningMove(defender);
    if(defWin){board[m.r][m.c]=null;continue;}

    let defenses=[];
    const attackerWin=immediateWinningMove(attacker);
    if(attackerWin){
      defenses=[attackerWin]; // occupy the winning square
    }else{
      // strongest defender tactical moves, including counter-threats
      defenses=orderedMoves(defender,6);
    }

    let allLose=true;
    for(const d of defenses){
      if(board[d.r][d.c])continue;
      board[d.r][d.c]=defender;
      const r=threatSearch(attacker,depth-1,deadline);
      board[d.r][d.c]=null;
      if(!r||!r.win){allLose=false;break;}
    }
    board[m.r][m.c]=null;
    if(allLose)return {win:true,move:m};
  }
  return {win:false,move:null};
}

function boardEval(){
  const cand=candidateCells();
  let bestO=0,bestX=0,secondO=0,secondX=0;
  for(const m of cand){
    const o=tacticalScore(m,'O').score;
    const x=tacticalScore(m,'X').score;
    if(o>bestO){secondO=bestO;bestO=o}else if(o>secondO)secondO=o;
    if(x>bestX){secondX=bestX;bestX=x}else if(x>secondX)secondX=x;
  }
  // Defense is intentionally weighted more heavily so the AI does not ignore
  // an opponent's developing fork while pursuing a cosmetic attack.
  return bestO+secondO*.30-(bestX+secondX*.34)*1.22;
}

let SEARCH_DEADLINE=0, SEARCH_ABORT=false, SEARCH_WIDTH=10;
const TT=new Map();

function boardKey(player,depth){
  // Compact enough for a browser-side transposition table.
  let str=player+depth+':';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=board[r][c];
    if(v)str+=r.toString(36)+c.toString(36)+v;
  }
  return str;
}
function timeUp(){
  if(Date.now()>SEARCH_DEADLINE){SEARCH_ABORT=true;return true}
  return false;
}

function immediateWinningMoves(player){
  const wins=[];
  for(const m of candidateCells()){
    board[m.r][m.c]=player;
    const win=checkWin(m.r,m.c,player);
    board[m.r][m.c]=null;
    if(win)wins.push(m);
  }
  return wins;
}

// Tactical move generator used inside the search tree. A normal heuristic
// search is not allowed to ignore a one-move win or a mandatory block.
function searchMoves(player,limit){
  const opp=player==='O'?'X':'O';
  const ownWins=immediateWinningMoves(player);
  if(ownWins.length)return ownWins;

  const oppWins=immediateWinningMoves(opp);
  if(oppWins.length){
    // Every opponent winning point is a mandatory defensive square.
    // If there are 2+, the position is generally already lost, but searching
    // each block lets alpha-beta prove that instead of hiding it in heuristic.
    return oppWins;
  }

  const forcing=exactForcingMoves(player,Math.min(10,limit));
  const ordered=orderedMoves(player,limit);
  const seen=new Set(), out=[];
  for(const m of [...forcing,...ordered]){
    const k=m.r*N+m.c;
    if(!seen.has(k)&&!board[m.r][m.c]){seen.add(k);out.push(m)}
    if(out.length>=limit)break;
  }
  return out;
}

function tacticalLeaf(maximizing,alpha,beta,plies){
  if(timeUp())return 0;
  const player=maximizing?'O':'X';
  const opp=maximizing?'X':'O';
  const ownWins=immediateWinningMoves(player);
  if(ownWins.length)return maximizing?1e13:-1e13;
  const oppWins=immediateWinningMoves(opp);
  if(plies<=0 && !oppWins.length)return boardEval();

  let moves;
  if(oppWins.length)moves=oppWins;
  else moves=exactForcingMoves(player,6);
  if(!moves.length)return boardEval();

  let value=maximizing?-Infinity:Infinity;
  for(const m of moves){
    if(board[m.r][m.c])continue;
    board[m.r][m.c]=player;
    let v;
    if(checkWin(m.r,m.c,player))v=maximizing?1e13:-1e13;
    else v=tacticalLeaf(!maximizing,alpha,beta,plies-1);
    board[m.r][m.c]=null;
    if(maximizing){value=Math.max(value,v);alpha=Math.max(alpha,value)}
    else{value=Math.min(value,v);beta=Math.min(beta,value)}
    if(alpha>=beta||SEARCH_ABORT)break;
  }
  return Number.isFinite(value)?value:boardEval();
}

function alphabeta(depth,alpha,beta,maximizing,lastMove,lastPlayer){
  if(timeUp())return 0;
  if(lastMove&&checkWin(lastMove.r,lastMove.c,lastPlayer))
    return lastPlayer==='O'?1e13+depth:-1e13-depth;
  if(depth===0)return tacticalLeaf(maximizing,alpha,beta,2);

  const player=maximizing?'O':'X';
  const key=depth>=2?boardKey(player,depth):null;
  if(key&&TT.has(key))return TT.get(key);

  let moves=searchMoves(player,SEARCH_WIDTH);
  if(!moves.length)return 0;

  let value=maximizing?-Infinity:Infinity;
  if(maximizing){
    for(const m of moves){
      board[m.r][m.c]='O';
      const v=alphabeta(depth-1,alpha,beta,false,m,'O');
      board[m.r][m.c]=null;
      if(SEARCH_ABORT)return value===-Infinity?0:value;
      value=Math.max(value,v); alpha=Math.max(alpha,value);
      if(alpha>=beta)break;
    }
  }else{
    for(const m of moves){
      board[m.r][m.c]='X';
      const v=alphabeta(depth-1,alpha,beta,true,m,'X');
      board[m.r][m.c]=null;
      if(SEARCH_ABORT)return value===Infinity?0:value;
      value=Math.min(value,v); beta=Math.min(beta,value);
      if(alpha>=beta)break;
    }
  }
  if(key&&TT.size<120000)TT.set(key,value);
  return value;
}

function searchBestMove(cfg){
  const roots=searchMoves('O',cfg.width);
  if(!roots.length)return null;
  let completedBest=roots[0];
  SEARCH_DEADLINE=Date.now()+cfg.time;
  SEARCH_WIDTH=cfg.width;
  TT.clear();

  for(let depth=2;depth<=cfg.depth;depth++){
    SEARCH_ABORT=false;
    let roundBest=completedBest,roundValue=-Infinity;
    for(const m of roots){
      if(timeUp())break;
      board[m.r][m.c]='O';
      const v=alphabeta(depth-1,-Infinity,Infinity,false,m,'O');
      board[m.r][m.c]=null;
      if(SEARCH_ABORT)break;
      if(v>roundValue){roundValue=v;roundBest=m}
    }
    if(!SEARCH_ABORT)completedBest=roundBest;
    else break;
  }
  return completedBest;
}

function terminal3(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]&&checkWin(r,c,board[r][c]))return board[r][c];
  return board.every(row=>row.every(Boolean))?'D':null;
}
function minimax3(isMax,depth){
  const e=terminal3();
  if(e==='O')return 10-depth;if(e==='X')return depth-10;if(e==='D')return 0;
  let best=isMax?-Infinity:Infinity,p=isMax?'O':'X';
  for(const m of candidateCells()){
    board[m.r][m.c]=p;const v=minimax3(!isMax,depth+1);board[m.r][m.c]=null;
    best=isMax?Math.max(best,v):Math.min(best,v);
  }
  return best;
}
function best3x3Move(){
  let best=null,v=-Infinity;
  for(const m of candidateCells()){
    board[m.r][m.c]='O';const x=minimax3(false,0);board[m.r][m.c]=null;
    if(x>v){v=x;best=m}
  }
  return best;
}


function aggressiveOpeningMove(){
  // Trong 19x19, AI ưu tiên tạo thế gần trung tâm ngay từ đầu.
  const stones=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c])stones.push({r,c});
  if(stones.length>0)return null;

  const mid=Math.floor(N/2);
  const preferred=[
    {r:mid,c:mid},
    {r:mid,c:mid+1},{r:mid+1,c:mid},{r:mid,c:mid-1},{r:mid-1,c:mid},
    {r:mid+1,c:mid+1},{r:mid-1,c:mid-1},{r:mid+1,c:mid-1},{r:mid-1,c:mid+1},
    {r:mid,c:mid+2},{r:mid+2,c:mid},{r:mid,c:mid-2},{r:mid-2,c:mid}
  ].filter(m=>m.r>=0&&m.r<N&&m.c>=0&&m.c<N&&!board[m.r][m.c]);

  if(!preferred.length)return null;

  let best=preferred[0],bestV=-Infinity;
  for(const m of preferred){
    const v=moveScore(m,'O');
    if(v>bestV){bestV=v;best=m;}
  }
  return best;
}

function aiMove(){
  if(gameOver||mode!=='ai'){aiThinking=false;return}
  if(N===3){
    const m=best3x3Move();aiThinking=false;if(m)play(m.r,m.c,'O');return;
  }

  const cfg=AI_CFG;

  // 1) Thắng ngay nếu có.
  let best=immediateWinningMove('O');

  // 2) Nếu đối thủ có nước thắng ngay thì bắt buộc chặn.
  if(!best)best=immediateWinningMove('X');

  // 3) Kiểm tra fork thật bằng mô phỏng: nếu X có thể tạo hai điểm thắng
  //    độc lập ở lượt kế, phải triệt ngay trước khi xét điểm heuristic.
  if(!best)best=strongestExactDefense();

  // 4) Nếu O tự tạo được fork thật (>=2 ô thắng kế tiếp), ưu tiên ép đối thủ.
  if(!best){
    const ownExact=exactForkMoves('O',30);
    const killer=ownExact.find(t=>t.x.fork);
    if(killer)best=killer.m;
  }

  // 5) Phòng thủ heuristic bổ sung cho các thế đang hình thành nhưng chưa thành fork thật.
  if(!best)best=safestDefensiveMove();

  // 6) Tìm chuỗi ép thắng chủ động.
  if(!best){
    const tacticalDeadline=Date.now()+Math.min(4200,cfg.time*.50);
    const ts=threatSearch('O',10,tacticalDeadline);
    if(ts&&ts.win)best=ts.move;
  }

  // 7) Nếu đối thủ có chuỗi ép mạnh, chiếm ngay điểm đe dọa nguy hiểm nhất.
  if(!best){
    const oppThreats=winningThreatMoves('X');
    if(oppThreats.length)best=oppThreats[0].m;
  }

  // 8) Mọi thế cờ có quân trên bàn đều phải qua Alpha-Beta. Không dùng
  //    heuristic khai cuộc để bỏ qua tìm kiếm như phiên bản cũ.
  if(!best)best=searchBestMove(cfg);

  // 9) Chỉ khi bàn hoàn toàn trống mới dùng nước khai cuộc trung tâm.
  if(!best)best=aggressiveOpeningMove();

  aiThinking=false;
  if(best)play(best.r,best.c,'O');
}
resetGame();
