<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBTAN</title><link rel="stylesheet" href="_base.css"><style>canvas{width:100%;max-width:620px;display:block;margin:auto;background:#0b0b14;border-radius:18px;touch-action:none}</style></head><body><main class="wrap"><div class="top"><a href="../">← Hub</a><h2>🏀 BBTAN</h2><span class="score" id="score">0</span></div><div class="card"><canvas id="c" width="600" height="700"></canvas><p class="msg">Kéo từ đáy lên để bắn bóng phá gạch.</p></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=700;let bs=[],balls=[{x:300,y:650,vx:0,vy:0,r:8,a:false}],drag=null,sc=0;for(let r=0;r<5;r++)for(let q=0;q<7;q++)bs.push({x:40+q*75,y:40+r*65,w:58,h:42,hp:r+1});function loop(){x.clearRect(0,0,W,H);x.fillStyle='#151322';x.fillRect(0,0,W,H);bs.forEach(b=>{x.fillStyle=['#8b4de8','#54c7d9','#f06c9b','#62d38a'][b.hp%4];x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#fff';x.fillText(b.hp,b.x+25,b.y+25)});balls.forEach(b=>{x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fillStyle='#fff';x.fill();if(b.a){b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>W-8)b.vx*=-1;if(b.y<8)b.vy*=-1;if(b.y>H-15){b.a=false;b.x=300;b.y=650;b.vx=b.vy=0}bs.forEach(q=>{if(q.hp>0&&b.x>q.x&&b.x<q.x+q.w&&b.y>q.y&&b.y<q.y+q.h){q.hp--;sc+=10;score.textContent=sc;b.vy*=-1}})}});requestAnimationFrame(loop)}c.onpointerdown=e=>{let r=c.getBoundingClientRect();drag=[e.clientX-r.left,e.clientY-r.top]};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),dx=e.clientX-r.left-drag[0],dy=e.clientY-r.top-drag[1],len=Math.hypot(dx,dy)||1;if(dy<0){balls[0].vx=dx/len*7;balls[0].vy=dy/len*7;balls[0].a=true}drag=null};loop()</script><script type="module" src="../assets/core/game-bridge.js"></script>
</body></html>
